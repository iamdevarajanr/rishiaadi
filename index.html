<html lang="en">
<head>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Rishi a Adi!">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#fef08a">
    
    <!-- Using Google Drive Thumbnail for Apple Devices -->
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH&sz=w256">
    <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH&sz=w256">
    
    <!-- Inline Manifest to Force Android App Icon -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Rishi a Adi!","short_name":"Rishi","display":"standalone","icons":[{"src":"https://drive.google.com/thumbnail?id=1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH&sz=w512","sizes":"512x512","type":"image/png"}],"start_url":".","background_color":"#111827","theme_color":"#fef08a"}'>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        body {
            margin: 0; 
            padding: 0;
            background-color: #111827; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; 
            width: 100vw;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        #app-wrapper {
            width: 100%;
            max-width: 500px; 
            height: 100dvh; 
            background: linear-gradient(135deg, #a7f3d0 0%, #34d399 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }

        #app-wrapper.panic-mode {
            background: linear-gradient(135deg, #fca5a5 0%, #ef4444 100%);
        }

        /* PC Layout Adjustments */
        @media (min-width: 600px) {
            #app-wrapper {
                height: 90dvh;
                max-height: 850px;
                border-radius: 2.5rem;
                border: 8px solid white;
                box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            }
        }

        .game-board {
            flex: 1; 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1; /* Forces perfect square */
            max-height: 52dvh; /* Prevents stretching out of screen */
            margin: 0 auto;
            padding: 10px 20px;
            position: relative;
            z-index: 10;
        }

        .hole {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #271c19 30%, #4a332a 100%);
            border-radius: 50%; /* Keeps it a perfect circle because parent is square */
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 15px 25px rgba(0, 0, 0, 0.9), 0 4px 6px rgba(0,0,0,0.2);
            border: 5px solid #8d6e63;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .mole {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            position: absolute;
            bottom: -110%;
            left: 0;
            transition: bottom 0.15s ease-out, transform 0.1s;
            pointer-events: none; 
        }

        .hole.up .mole {
            bottom: -5%;
            transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .hole.whacked .mole {
            transform: scale(0.6) translateY(50%);
            filter: brightness(0.5) contrast(1.5);
        }

        .mole.special { filter: drop-shadow(0 -5px 15px #f59e0b) saturate(1.5); }
        .mole.spoof { filter: grayscale(20%) sepia(50%) hue-rotate(320deg) contrast(1.3) drop-shadow(0 0 10px red); }

        .hit-text {
            position: absolute;
            font-weight: 900;
            font-size: 3rem;
            pointer-events: none;
            z-index: 50;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0px 4px 8px rgba(0,0,0,0.9);
            white-space: nowrap;
        }
        .hit-normal { color: #fff; } 
        .hit-special { color: #fde047; font-size: 3.5rem;} 
        .hit-bad { color: #ef4444; font-size: 2.5rem; }

        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -100px) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -150px) scale(1); opacity: 0; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px) rotate(-3deg); }
            50% { transform: translateX(12px) rotate(3deg); }
            75% { transform: translateX(-12px) rotate(-3deg); }
        }
        .shake-screen { animation: shake 0.3s ease-in-out; }
        .shake-hard { animation: shake 0.4s ease-in-out; }

        .heart {
            font-size: 1.5rem;
            transition: all 0.3s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .heart.lost {
            opacity: 0.2;
            filter: grayscale(100%);
            transform: scale(0.7);
        }
        
        /* PC Hammer Cursor */
        #hammer-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 5rem;
            transform-origin: bottom right; 
            transform: translate(-30%, -30%) rotate(0deg); 
            transition: transform 0.05s ease-out;
            display: none;
            filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.5));
        }
        
        #hammer-cursor.strike {
            transform: translate(-40%, -20%) rotate(-60deg);
        }

        @media (pointer: coarse) {
            #hammer-cursor { display: none !important; }
        }
        @media (pointer: fine) {
            #app-wrapper, .hole { cursor: none !important; }
            button, .btn { cursor: pointer !important; }
            #hammer-cursor { display: block; }
        }
    </style>
</head>
<body>

    <div id="hammer-cursor">🔨</div>

    <div id="app-wrapper">
        
        <!-- Splash Screen -->
        <div id="splashScreen" class="absolute inset-0 z-[100] bg-gradient-to-br from-yellow-300 to-orange-500 flex flex-col items-center justify-center transition-opacity duration-700">
            <img referrerpolicy="no-referrer" src="https://drive.google.com/thumbnail?id=1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH&sz=w600" alt="Logo" class="w-48 h-48 md:w-56 md:h-56 object-cover rounded-full mb-6 animate-bounce drop-shadow-2xl border-4 border-white">
            <h1 class="text-5xl md:text-6xl font-black text-white tracking-widest drop-shadow-xl text-center" style="-webkit-text-stroke: 2px #c2410c;">RISHI A ADI!</h1>

        <button id="fullscreenBtn" class="absolute top-4 right-4 z-50 bg-black/30 hover:bg-black/50 text-white p-3 rounded-xl shadow-lg backdrop-blur-sm transition-all active:scale-95">

                <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
            </div>

            <!-- Score Panel -->
            <div class="flex justify-between items-center w-full bg-white/60 p-3 rounded-3xl shadow-lg border-4 border-white mb-3 relative overflow-hidden">

            <!-- Controls -->
            <div class="flex gap-2 w-full mb-3">

                <button id="btn-hard" class="diff-btn flex-1 py-2 rounded-2xl font-black transition-all bg-white/50 text-emerald-900 border-2 border-white hover:bg-white text-lg tracking-wide" data-diff="hard">Hard 🔥</button>

                <button id="pauseBtn" class="flex-1 bg-blue-400 hover:bg-blue-500 text-white font-black py-3 px-4 rounded-2xl shadow-xl active:scale-95 text-lg uppercase tracking-wide border-b-6 border-blue-600 transition-all hidden">Pause</button>

            </div>

        <div class="game-board" id="gameBoard">
            <div class="hole" data-index="0"><img referrerpolicy="no-referrer" class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="1"><img referrerpolicy="no-referrer" class="mole" alt="Mole" draggable="false" src=""></div>

            <div class="hole" data-index="7"><img referrerpolicy="no-referrer" class="mole" alt="Mole" draggable="false" src=""></div>

        <div id="messageBox" class="absolute inset-0 bg-black/80 flex items-center justify-center hidden z-50 backdrop-blur-md p-4">
            <div class="bg-white rounded-[2rem] p-6 w-full max-w-sm text-center shadow-[0_0_40px_rgba(255,255,255,0.2)] border-8 border-yellow-400 flex flex-col items-center transform transition-all scale-100">

                <p id="scoreTextContainer" class="text-gray-600 mb-4 text-lg font-bold bg-gray-100 p-4 rounded-2xl w-full border-2 border-gray-200">

                <button id="closeMsgBtn" class="w-full bg-gradient-to-b from-yellow-300 to-yellow-500 text-yellow-900 font-black py-4 px-2 rounded-2xl text-[1.2rem] tracking-wide shadow-xl active:scale-95 border-b-8 border-yellow-700 transition-all leading-tight">

    <script>
        (() => {
            // Assets - Using direct Thumbnail URL bypass to force loading securely everywhere
            const NORMAL_IMG = 'https://drive.google.com/thumbnail?id=1ROK5CKKC-Ae9s0vsbieqHafEQriSCeFz&sz=w600';
            const SPECIAL_IMG = 'https://drive.google.com/thumbnail?id=1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH&sz=w600';
            const SPOOF_IMG = 'https://drive.google.com/thumbnail?id=1gaLbrDvBw-rkPz8CNW5izBFSRFMuwXMN&sz=w600';
            
            // Preload to prevent lag 
            [NORMAL_IMG, SPECIAL_IMG, SPOOF_IMG].forEach(src => { 
                const img = new Image(); 
                img.referrerPolicy = "no-referrer";
                img.src = src; 
            });

            const wrapper = document.getElementById('app-wrapper');
            const splashScreen = document.getElementById('splashScreen');
            const holes = document.querySelectorAll('.hole');
            const scoreDisplay = document.getElementById('score');
            const timeDisplay = document.getElementById('time');
            const livesHearts = document.querySelectorAll('.heart');
            
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const endBtn = document.getElementById('endBtn');
            const diffBtns = document.querySelectorAll('.diff-btn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const hammerCursor = document.getElementById('hammer-cursor');
            
            const messageBox = document.getElementById('messageBox');
            const popupLogo = document.getElementById('popupLogo');
            const msgTitle = document.getElementById('msgTitle');
            const msgTop = document.getElementById('msgTop');
            const msgBottom = document.getElementById('msgBottom');
            const finalScoreDisplay = document.getElementById('finalScore');
            const closeMsgBtn = document.getElementById('closeMsgBtn');

            const dict = {
                highScore: [
                    "Nee periya pudingi than!", "Verithanam!", "Aathadi, sema adi!", 
                    "Rishi azhuguraan!", "Thalaivaa super!", "Kizhichita po!", 
                    "Marana Mass!", "Unna adikka aale illa!", "Pinita po boss!"
                ],
                timeoutTitle: [
                    "Nee adichathu pothum.", "Time mudinjithu!", "Aatam Over!", 
                    "Pothum da saami!", "Kaipulla tired aagita!", "Nimirnthu paru!", 
                    "Kai valikithaa?", "Moochu vangutha?"
                ],
                quitTitle: [
                    "Bayathagoli !", "Oditaya?", "Saththam ilama poita!", 
                    "Enna bayama?", "Odatha nillu!", "Suruttu vizhunthucha?", 
                    "Dhairiyam illaya?"
                ],
                quitTextTop: ["Ena", "Enna pa", "Ada", "Acho", "Ayayyo", "Yov", "Che"],
                quitTextBottom: [
                    "thadava adichathukai bayanthu end koduthuta.", "adichathuke bayanthutiya?", 
                    "podhum nu oditiya?", "adi kooda thaanga matiya?", "points eduthutu escape ah?"
                ],
                normalTop: [
                    "Nee rishi ah", "Unnala", "Summa", "Kevalam", "Romba srama pattu", 
                    "Eppadiyo mukki", "Oru valiya", "Poraadi"
                ],
                normalBottom: [
                    "thadava adichiruka.", "adi dhaan adika mudinjithu.", 
                    "point than eduthuka.", "thadava adi vaangitaan.", "points eduthuruka."
                ],
                deadTitle: [
                    "Oolara Vitta!", "Sothappal!", "Kaanavitta!", "Gaali!", 
                    "Sema bulb!", "Katha mudinjithu!", "Avasara kudukkai!",
                    "Goyyale out!"
                ],
                deadBottom: [
                    "adichitu life ellam tholachita.", "points eduthutu out aagita.", 
                    "adichathukulla life gaali.", "points ku asai pattu gaali aagita."
                ],
                funnyMiss: [
                    "Ayyo!", "Miss!", "Kaathu!", "Loosu!", "Goyyale!", 
                    "Venna!", "Sothappal!", "Bulb!", "Arivu ketta!", "Kuruvi!"
                ],
                playAgain: [
                    "Mudicha ena thirumba adi", "Dhairiyam iruntha vaa", "Innum adikanuma?", 
                    "Thirumba try panriya?", "Vaa da paakalam", "Restart pannu boss", 
                    "Innoru aatam podlama?", "Gethu iruntha thirumba aadu"
                ]
            };

            let lastRandomWord = "";
            function getRandomText(array) { 
                let word;
                do { word = array[Math.floor(Math.random() * array.length)]; } 
                while (word === lastRandomWord && array.length > 1);
                lastRandomWord = word;
                return word;
            }

            let synth, memSynth, noiseSynth;
            let audioInit = false;

            function initAudio() {
                if(audioInit) return;
                try {
                    Tone.start();
                    synth = new Tone.Synth({ oscillator: { type: 'sine' } }).toDestination();
                    memSynth = new Tone.MembraneSynth({ pitchDecay: 0.1, octaves: 4 }).toDestination();
                    noiseSynth = new Tone.NoiseSynth({
                        noise: { type: 'pink' },
                        envelope: { attack: 0.01, decay: 0.3, sustain: 0 }
                    }).toDestination();
                    audioInit = true;
                } catch(e) { console.log("Audio skipped"); }
            }

            function playSound(type) {
                if(!audioInit) return;
                try {
                    const now = Tone.now();
                    if(type === 'hitNormal') synth.triggerAttackRelease("C5", "16n", now);
                    else if(type === 'hitSpecial') {
                        synth.triggerAttackRelease("E5", "16n", now);
                        synth.triggerAttackRelease("G5", "16n", now + 0.1);
                    }
                    else if(type === 'miss') memSynth.triggerAttackRelease("C2", "8n", now); 
                    else if(type === 'spoof') noiseSynth.triggerAttackRelease("8n", now); 
                    else if(type === 'over') synth.triggerAttackRelease("A3", "2n", now);
                } catch(e) {}
            }

            let score = 0, lives = 5, timeLeft = 0, currentDiff = 'normal';
            let isPlaying = false, isPaused = false;
            let gameLoopTimer, countdownTimer;
            let activeMoles = 0;

            const config = {
                // Easy Mode: Smooth scaling, max 1 mole at a time
                normal: { duration: 30, minTime: 650, maxTime: 1000, specialChance: 0.20, maxMoles: 1 },
                // Hard Mode: Slower maximum speed than before, but up to 2 moles at once
                hard: { duration: 30, minTime: 500, maxTime: 850, specialChance: 0.25, maxMoles: 2 }
            };

            window.addEventListener('load', () => {
                setTimeout(() => {
                    splashScreen.style.opacity = '0';
                    setTimeout(() => splashScreen.style.display = 'none', 700);
                }, 1500);
                timeDisplay.textContent = config[currentDiff].duration;
            });

            // Hammer logic for PC
            document.addEventListener('mousemove', (e) => {
                if(window.matchMedia("(pointer: fine)").matches) {
                    hammerCursor.style.left = e.clientX + 'px';
                    hammerCursor.style.top = e.clientY + 'px';
                }
            });
            const strikeHammer = () => hammerCursor.classList.add('strike');
            const liftHammer = () => hammerCursor.classList.remove('strike');
            document.addEventListener('pointerdown', strikeHammer);
            document.addEventListener('pointerup', liftHammer);

            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
                    else document.exitFullscreen().catch(()=>{});
                } catch(err) { fullscreenBtn.style.display = 'none'; }
            });

            function updateLivesUI() {
                livesHearts.forEach((heart, i) => {
                    if (i < lives) heart.classList.remove('lost');
                    else heart.classList.add('lost');
                });
            }

            function spawnMole() {
                if (!isPlaying || isPaused) return;

                const openHoles = Array.from(holes).filter(h => !h.classList.contains('up') && h.dataset.locked !== 'true');
                if (openHoles.length === 0 || activeMoles >= config[currentDiff].maxMoles) {
                    gameLoopTimer = setTimeout(spawnMole, 200);
                    return;
                }

                const hole = openHoles[Math.floor(Math.random() * openHoles.length)];
                const img = hole.querySelector('.mole');
                const conf = config[currentDiff];

                let type = 'normal';
                let chance = Math.random();
                
                if (currentDiff === 'hard') {
                    if (chance < 0.15) type = 'spoof'; 
                    else if (chance < 0.35) type = 'special'; 
                } else {
                    if (chance < conf.specialChance) type = 'special';
                }

                hole.dataset.type = type;
                hole.dataset.locked = 'false'; 
                hole.classList.remove('whacked'); 

                if (type === 'special') {
                    img.src = SPECIAL_IMG;
                    img.className = 'mole special';
                } else if (type === 'spoof') {
                    img.src = SPOOF_IMG;
                    img.className = 'mole spoof';
                } else {
                    img.src = NORMAL_IMG;
                    img.className = 'mole';
                }

                hole.classList.add('up');
                activeMoles++;

                // Difficulty slowly increases as timer goes down (Drops down to 85% of original time max to stay playable)
                let timeProgressFactor = 0.85 + (0.15 * (timeLeft / conf.duration));
                
                const stayTime = Math.random() * (conf.maxTime * timeProgressFactor - conf.minTime * timeProgressFactor) + (conf.minTime * timeProgressFactor);
                
                // Track the specific timeout for this hole so we can cancel it if hit
                const hideTimer = setTimeout(() => {
                    if (hole.classList.contains('up') && !hole.classList.contains('whacked')) {
                        hole.classList.remove('up');
                        activeMoles--;
                    }
                }, stayTime);
                
                hole.dataset.timerId = hideTimer;

                const nextTime = (Math.random() * 400 + 300) * timeProgressFactor;
                gameLoopTimer = setTimeout(spawnMole, nextTime);
            }

            function createFloatingText(x, y, text, typeClass) {
                const el = document.createElement('div');
                el.textContent = text;
                el.className = `hit-text ${typeClass}`;
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                wrapper.appendChild(el);
                setTimeout(() => el.remove(), 600);
            }

            function handleHit(e) {
                if (!isPlaying || isPaused) return;
                
                const hole = e.target.closest('.hole');
                if (!hole) return;

                // Stop Double-Clicks / Ghost-Clicks
                if (hole.dataset.locked === 'true' || hole.classList.contains('whacked')) return;
                
                const rect = hole.getBoundingClientRect();
                const x = e.clientX || (e.touches ? e.touches[0].clientX : rect.left + rect.width/2);
                const y = e.clientY || (e.touches ? e.touches[0].clientY : rect.top + rect.height/2);

                hole.dataset.locked = 'true';
                
                if (hole.classList.contains('up')) {
                    // Successful Hit! Cancel the auto-hide timer.
                    clearTimeout(parseInt(hole.dataset.timerId));
                    hole.classList.add('whacked'); 
                    activeMoles--;
                    
                    setTimeout(() => {
                        hole.classList.remove('up', 'whacked');
                        hole.dataset.locked = 'false';
                    }, 200);
                    
                    const type = hole.dataset.type;
                    if (type === 'spoof') {
                        score -= 5;
                        playSound('spoof');
                        createFloatingText(x, y, `-${getRandomText(dict.funnyMiss)}`, "hit-bad");
                        wrapper.classList.add('shake-hard');
                        setTimeout(() => wrapper.classList.remove('shake-hard'), 400);
                    } else {
                        // Scoring (No combo system, just raw points)
                        const earnedPts = (type === 'special') ? 2 : 1;
                        score += earnedPts;
                        
                        playSound(type === 'special' ? 'hitSpecial' : 'hitNormal');
                        
                        const textClass = (type === 'special' ? "hit-special" : "hit-normal");
                        createFloatingText(x, y, `+${earnedPts}`, textClass);
                        
                        if(type === 'special') {
                            wrapper.classList.add('shake-screen');
                            setTimeout(() => wrapper.classList.remove('shake-screen'), 300);
                        }
                    }
                } else {
                    // Penalty for missing!
                    lives--;
                    score--;
                    playSound('miss');
                    createFloatingText(x, y, `-${getRandomText(dict.funnyMiss)}`, "hit-bad");
                    wrapper.classList.add('shake-screen');
                    setTimeout(() => wrapper.classList.remove('shake-screen'), 300);
                    updateLivesUI();

                    setTimeout(() => { hole.dataset.locked = 'false'; }, 200);

                    if (lives <= 0) endGame('dead');
                }
                
                scoreDisplay.textContent = score;
            }

            // pointerdown prevents duplicate mouse/touch events firing
            holes.forEach(hole => { 
                hole.addEventListener('pointerdown', handleHit); 
            });

            function startCountdown() {
                clearInterval(countdownTimer);
                countdownTimer = setInterval(() => {
                    if (!isPaused) {
                        timeLeft--;
                        timeDisplay.textContent = timeLeft;
                        
                        if(timeLeft <= 10 && timeLeft > 0) {
                            timeDisplay.classList.add('animate-pulse');
                            wrapper.classList.add('panic-mode');
                        } else {
                            wrapper.classList.remove('panic-mode');
                        }
                        
                        if (timeLeft <= 0) endGame('timeout');
                    }
                }, 1000);
            }

            function startGame() {
                initAudio();
                isPlaying = true;
                isPaused = false;
                score = 0;
                lives = 5;
                timeLeft = config[currentDiff].duration;
                activeMoles = 0;
                
                scoreDisplay.textContent = score;
                timeDisplay.textContent = timeLeft;
                timeDisplay.classList.remove('animate-pulse');
                wrapper.classList.remove('panic-mode');
                updateLivesUI();
                
                startBtn.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
                endBtn.classList.remove('hidden');
                diffBtns.forEach(b => b.disabled = true);

                holes.forEach(h => {
                    h.classList.remove('up', 'whacked');
                    h.dataset.locked = 'false';
                    clearTimeout(parseInt(h.dataset.timerId));
                });

                startCountdown();
                spawnMole();
            }

            function togglePause() {
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? "Resume" : "Pause";
                pauseBtn.classList.toggle('bg-purple-500', isPaused);
                pauseBtn.classList.toggle('bg-blue-400', !isPaused);
            }

            function endGame(reason) {
                isPlaying = false;
                clearTimeout(gameLoopTimer);
                clearInterval(countdownTimer);
                timeDisplay.classList.remove('animate-pulse');
                wrapper.classList.remove('panic-mode');
                
                playSound('over');

                startBtn.classList.remove('hidden');
                pauseBtn.classList.add('hidden');
                endBtn.classList.add('hidden');
                pauseBtn.textContent = "Pause";
                pauseBtn.classList.remove('bg-purple-500');
                pauseBtn.classList.add('bg-blue-400');
                diffBtns.forEach(b => b.disabled = false);

                holes.forEach(h => {
                    h.classList.remove('up', 'whacked')
                    clearTimeout(parseInt(h.dataset.timerId));
                });

                closeMsgBtn.textContent = getRandomText(dict.playAgain);
                finalScoreDisplay.textContent = score;
                
                // ONLY SHOWING IMAGE 1 (Normal) OR IMAGE 2 (Special). Spoof face is excluded here.
                if (reason === 'timeout' && score >= 40) {
                    msgTitle.textContent = getRandomText(dict.highScore);
                    msgTitle.className = "text-3xl font-black text-emerald-600 mb-2 animate-bounce";
                    popupLogo.src = SPECIAL_IMG;
                    msgTop.textContent = "Nee rishi ah";
                    msgBottom.textContent = "thadava adichiruka.";
                } else if (reason === 'timeout') {
                    msgTitle.textContent = getRandomText(dict.timeoutTitle);
                    msgTitle.className = "text-3xl font-black text-gray-800 mb-2";
                    popupLogo.src = NORMAL_IMG;
                    msgTop.textContent = getRandomText(dict.normalTop);
                    msgBottom.textContent = getRandomText(dict.normalBottom);
                } else if (reason === 'dead') {
                    msgTitle.textContent = getRandomText(dict.deadTitle);
                    msgTitle.className = "text-3xl font-black text-red-600 mb-2 animate-pulse drop-shadow-md";
                    popupLogo.src = NORMAL_IMG; 
                    msgTop.textContent = getRandomText(dict.normalTop);
                    msgBottom.textContent = getRandomText(dict.deadBottom);
                } else if (reason === 'quit') {
                    msgTitle.textContent = getRandomText(dict.quitTitle);
                    msgTitle.className = "text-3xl font-black text-purple-600 mb-2";
                    popupLogo.src = NORMAL_IMG;
                    msgTop.textContent = getRandomText(dict.quitTextTop);
                    msgBottom.textContent = getRandomText(dict.quitTextBottom);
                }

                setTimeout(() => messageBox.classList.remove('hidden'), 500);
            }

            startBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', togglePause);
            endBtn.addEventListener('click', () => endGame('quit'));

            closeMsgBtn.addEventListener('click', () => {
                messageBox.classList.add('hidden');
                scoreDisplay.textContent = '0';
                timeDisplay.textContent = config[currentDiff].duration;
                lives = 5;
                updateLivesUI();
            });

            diffBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (isPlaying) return;
                    diffBtns.forEach(b => {
                        b.classList.remove('bg-emerald-500', 'text-white', 'shadow-xl', 'border-emerald-700');
                        b.classList.add('bg-white/50', 'text-emerald-900');
                    });
                    const target = e.target;
                    target.classList.add('bg-emerald-500', 'text-white', 'shadow-xl', 'border-emerald-700');
                    target.classList.remove('bg-white/50', 'text-emerald-900');
                    currentDiff = target.dataset.diff;
                    timeDisplay.textContent = config[currentDiff].duration;
                });
            });

        })();
    </script>
</body>
</html>
