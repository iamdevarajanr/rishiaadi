<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rishi a Adi!</title>
    
    <!-- App Icons for Mobile Install (Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#fef08a">
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        body {
            margin: 0; 
            padding: 0;
            background-color: #111827; /* Dark cinematic backdrop for PC */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; 
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            touch-action: none; /* Block pinch-zoom and scroll */
            user-select: none;
        }

        #app-wrapper {
            width: 100%;
            max-width: 550px;
            height: 100dvh;
            background: linear-gradient(135deg, #a7f3d0 0%, #34d399 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }

        #app-wrapper.panic-mode {
            background: linear-gradient(135deg, #fca5a5 0%, #ef4444 100%);
        }

        /* PC specific styling */
        @media (min-width: 600px) {
            #app-wrapper {
                height: 90vh;
                max-height: 950px;
                border-radius: 2.5rem;
                border: 10px solid white;
            }
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            width: 100%;
            padding: 1.5rem;
            position: relative;
            z-index: 10;
            margin-top: auto;
            margin-bottom: auto;
        }

        .hole {
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle, #271c19 30%, #4a332a 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 15px 25px rgba(0, 0, 0, 0.9), 0 4px 6px rgba(0,0,0,0.2);
            border: 5px solid #8d6e63;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .mole {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            bottom: -100%;
            left: 0;
            transition: bottom 0.15s ease-out, transform 0.1s;
            pointer-events: none; 
        }

        .hole.up .mole {
            bottom: 0;
            transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .hole.whacked .mole {
            transform: scale(0.8) translateY(20%);
            filter: brightness(0.5) contrast(1.5);
        }

        .mole.special { filter: drop-shadow(0 0 15px #f59e0b) saturate(1.5); }
        .mole.spoof { filter: grayscale(40%) sepia(80%) hue-rotate(320deg) contrast(1.2); }

        .hit-text {
            position: absolute;
            font-weight: 900;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 50;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0px 4px 8px rgba(0,0,0,0.9);
            white-space: nowrap;
        }
        .hit-normal { color: #fff; } 
        .hit-special { color: #fde047; } 
        .hit-bad { color: #ef4444; font-size: 2rem; }
        .hit-combo { color: #a855f7; font-size: 3rem; text-shadow: 0 0 10px white; }

        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -100px) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -150px) scale(1); opacity: 0; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px) rotate(-3deg); }
            50% { transform: translateX(12px) rotate(3deg); }
            75% { transform: translateX(-12px) rotate(-3deg); }
        }
        .shake-screen { animation: shake 0.3s ease-in-out; }
        .shake-hard { animation: shake 0.4s ease-in-out; }

        .heart {
            font-size: 1.5rem;
            transition: all 0.3s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .heart.lost {
            opacity: 0.2;
            filter: grayscale(100%);
            transform: scale(0.7);
        }
        
        .combo-badge {
            transition: all 0.2s;
            opacity: 0;
            transform: scale(0.5);
        }
        .combo-badge.active {
            opacity: 1;
            transform: scale(1);
        }

        #hammer-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 5rem;
            transform-origin: bottom right; 
            transform: translate(-30%, -30%) rotate(0deg); 
            transition: transform 0.05s ease-out;
            display: none;
            filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.5));
        }
        
        #hammer-cursor.strike {
            transform: translate(-40%, -20%) rotate(-60deg);
        }

        /* Hide hammer on touch screens (phones), show on PC */
        @media (pointer: coarse) {
            #hammer-cursor { display: none !important; }
        }
        @media (pointer: fine) {
            #app-wrapper, .hole { cursor: none !important; }
            button, .btn { cursor: pointer !important; }
            #hammer-cursor { display: block; }
        }
    </style>
</head>
<body>

    <!-- Hammer Cursor Element -->
    <div id="hammer-cursor">🔨</div>

    <div id="app-wrapper">
        
        <div id="splashScreen" class="absolute inset-0 z-[100] bg-gradient-to-br from-yellow-300 to-orange-500 flex flex-col items-center justify-center transition-opacity duration-700">
            <img src="https://lh3.googleusercontent.com/d/1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH" alt="Logo" class="w-48 h-48 md:w-56 md:h-56 object-cover rounded-full mb-6 animate-bounce drop-shadow-2xl border-4 border-white">
            <h1 class="text-5xl md:text-6xl font-black text-white tracking-widest drop-shadow-xl text-center" style="-webkit-text-stroke: 2px #c2410c;">RISHI A ADI!</h1>
            <p class="mt-6 text-white font-black animate-pulse text-2xl bg-black/20 px-6 py-2 rounded-full backdrop-blur-sm">Loading...</p>
        </div>

        <!-- Fullscreen Button -->
        <button id="fullscreenBtn" class="absolute top-4 right-4 z-50 bg-black/30 hover:bg-black/50 text-white p-3 rounded-xl shadow-lg backdrop-blur-sm transition-all active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        </button>

        <div class="w-full px-6 pt-16 pb-2 flex flex-col items-center z-20">
            
            <!-- Lives Display -->
            <div id="livesContainer" class="flex gap-2 mb-3 bg-black/10 px-4 py-2 rounded-full backdrop-blur-sm">
                <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
            </div>

            <!-- Score & Time Panel -->
            <div class="flex justify-between items-center w-full bg-white/60 p-4 rounded-3xl shadow-lg border-4 border-white mb-4 relative overflow-hidden">
                <div class="flex flex-col z-10">
                    <span class="text-sm uppercase tracking-widest text-green-900 font-bold">Score</span>
                    <span id="score" class="text-green-700 text-5xl font-black drop-shadow-sm">0</span>
                </div>
                
                <!-- Combo Badge -->
                <div id="comboBadge" class="combo-badge absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 bg-purple-500 text-white font-black px-4 py-1 rounded-full border-2 border-white shadow-lg text-lg flex items-center gap-1 z-0">
                    🔥 <span id="comboText">2X</span>
                </div>

                <div class="flex flex-col items-end z-10">
                    <span class="text-sm uppercase tracking-widest text-red-900 font-bold">Time</span>
                    <span id="time" class="text-red-600 text-5xl font-black drop-shadow-sm">0</span>
                </div>
            </div>
            
            <!-- Difficulty Toggles -->
            <div class="flex gap-3 w-full mb-4">
                <button id="btn-normal" class="diff-btn flex-1 py-3 rounded-2xl font-black transition-all bg-emerald-500 text-white shadow-xl transform scale-100 border-b-4 border-emerald-700 text-lg tracking-wide" data-diff="normal">Normal</button>
                <button id="btn-hard" class="diff-btn flex-1 py-3 rounded-2xl font-black transition-all bg-white/50 text-emerald-900 border-2 border-white hover:bg-white text-lg tracking-wide" data-diff="hard">Hard 🔥</button>
            </div>

            <!-- Controls -->
            <div class="flex gap-3 w-full">
                <button id="startBtn" class="flex-[2] bg-gradient-to-b from-yellow-300 to-yellow-500 hover:to-yellow-400 text-yellow-900 font-black py-4 px-4 rounded-2xl shadow-xl active:scale-95 text-2xl uppercase tracking-widest border-b-8 border-yellow-700 transition-all">Start</button>
                <button id="pauseBtn" class="flex-1 bg-blue-400 hover:bg-blue-500 text-white font-black py-4 px-4 rounded-2xl shadow-xl active:scale-95 text-lg uppercase tracking-wide border-b-6 border-blue-600 transition-all hidden">Pause</button>
                <button id="endBtn" class="flex-1 bg-red-400 hover:bg-red-500 text-white font-black py-4 px-4 rounded-2xl shadow-xl active:scale-95 text-lg uppercase tracking-wide border-b-6 border-red-600 transition-all hidden">End</button>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="hole" data-index="0"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="1"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="2"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="3"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="4"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="5"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="6"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="7"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="8"><img class="mole" alt="Mole" draggable="false" src=""></div>
        </div>

        <div id="messageBox" class="absolute inset-0 bg-black/80 flex items-center justify-center hidden z-50 backdrop-blur-md p-4">
            <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm text-center shadow-[0_0_40px_rgba(255,255,255,0.2)] border-8 border-yellow-400 flex flex-col items-center transform transition-all scale-100">
                <img id="popupLogo" src="https://lh3.googleusercontent.com/d/1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH" class="w-40 h-40 object-cover rounded-full mb-6 border-4 border-yellow-400 shadow-xl">
                
                <h2 id="msgTitle" class="text-3xl font-black text-gray-800 mb-3 leading-tight">Time's Up!</h2>
                
                <p id="scoreTextContainer" class="text-gray-600 mb-6 text-xl font-bold bg-gray-100 p-4 rounded-2xl w-full border-2 border-gray-200">
                    <span id="msgTop">Nee rishi ah</span><br>
                    <span id="finalScore" class="font-black text-emerald-500 text-[4.5rem] leading-none my-2 block drop-shadow-md">0</span>
                    <span id="msgBottom">thadava adichiruka.</span>
                </p>
                
                <button id="closeMsgBtn" class="w-full bg-gradient-to-b from-yellow-300 to-yellow-500 text-yellow-900 font-black py-4 px-4 rounded-2xl text-xl tracking-wide shadow-xl active:scale-95 border-b-8 border-yellow-700 transition-all leading-tight">
                    Play Again
                </button>
            </div>
        </div>

    </div>

    <script>
        (() => {
            // Assets (Updated direct links)
            const NORMAL_IMG = 'https://drive.google.com/uc?export=view&id=1ROK5CKKC-Ae9s0vsbieqHafEQriSCeFz';
            const SPECIAL_IMG = 'https://drive.google.com/uc?export=view&id=1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH';
            const SPOOF_IMG = 'https://drive.google.com/uc?export=view&id=1gaLbrDvBw-rkPz8CNW5izBFSRFMuwXMN';
            
            // Preload to prevent lag
            [NORMAL_IMG, SPECIAL_IMG, SPOOF_IMG].forEach(src => { const img = new Image(); img.src = src; });

            // DOM
            const wrapper = document.getElementById('app-wrapper');
            const splashScreen = document.getElementById('splashScreen');
            const holes = document.querySelectorAll('.hole');
            const scoreDisplay = document.getElementById('score');
            const timeDisplay = document.getElementById('time');
            const livesHearts = document.querySelectorAll('.heart');
            const comboBadge = document.getElementById('comboBadge');
            const comboText = document.getElementById('comboText');
            
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const endBtn = document.getElementById('endBtn');
            const diffBtns = document.querySelectorAll('.diff-btn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const hammerCursor = document.getElementById('hammer-cursor');
            
            // Popup
            const messageBox = document.getElementById('messageBox');
            const popupLogo = document.getElementById('popupLogo');
            const msgTitle = document.getElementById('msgTitle');
            const msgTop = document.getElementById('msgTop');
            const msgBottom = document.getElementById('msgBottom');
            const finalScoreDisplay = document.getElementById('finalScore');
            const closeMsgBtn = document.getElementById('closeMsgBtn');

            const dict = {
                highScore: ["Nee periya pudingi than!", "Verithanam!", "Aathadi, sema adi!", "Rishi azhuguraan!", "Thalaivaa super!", "Kizhichita po!", "Marana Mass!"],
                timeoutTitle: ["Nee adichathu pothum.", "Time mudinjithu!", "Aatam Over!", "Pothum da saami!", "Kaipulla tired aagita!", "Nimirnthu paru!"],
                quitTitle: ["Bayathagoli !", "Oditaya?", "Saththam ilama poita!", "Enna bayama?", "Odatha nillu!", "Suruttu vizhunthucha?"],
                quitTextTop: ["Ena", "Enna pa", "Ada", "Acho", "Ayayyo"],
                quitTextBottom: ["thadava adichathukai bayanthu end koduthuta.", "adichathuke bayanthutiya?", "podhum nu oditiya?", "adi kooda thaanga matiya?", "points eduthutu escape ah?"],
                normalTop: ["Nee rishi ah", "Unnala", "Summa", "Kevalam", "Romba srama pattu"],
                normalBottom: ["thadava adichiruka.", "adi dhaan adika mudinjithu.", "point than eduthuka.", "thadava adi vaangitaan.", "points eduthuruka."],
                deadTitle: ["Oolara Vitta!", "Sothappal!", "Kaanavitta!", "Gaali!", "Sema bulb!", "Katha mudinjithu!", "Avasara kudukkai!"],
                deadBottom: ["adichitu life ellam tholachita.", "points eduthutu out aagita.", "adichathukulla life gaali.", "points ku asai pattu gaali aagita."],
                funnyMiss: ["Ayyo!", "Miss!", "Kaathu!", "Loosu!", "Goyyale!", "Venna!", "Sothappal!", "Bulb!", "Arivu ketta!", "Kuruvi!"],
                playAgain: ["Mudicha ena thirumba adi", "Dhairiyam iruntha vaa", "Innum adikanuma?", "Thirumba try panriya?", "Vaa da paakalam", "Restart pannu boss", "Innoru aatam podlama?"]
            };

            function getRandomText(array) { return array[Math.floor(Math.random() * array.length)]; }

            let synth, memSynth, noiseSynth, comboSynth;
            let audioInit = false;

            function initAudio() {
                if(audioInit) return;
                try {
                    Tone.start();
                    synth = new Tone.Synth({ oscillator: { type: 'sine' } }).toDestination();
                    comboSynth = new Tone.Synth({ oscillator: { type: 'triangle' } }).toDestination();
                    memSynth = new Tone.MembraneSynth({ pitchDecay: 0.2, octaves: 2 }).toDestination(); // Funnier boing
                    noiseSynth = new Tone.NoiseSynth({
                        noise: { type: 'pink' },
                        envelope: { attack: 0.001, decay: 0.2, sustain: 0 }
                    }).toDestination();
                    audioInit = true;
                } catch(e) { console.log("Audio skipped"); }
            }

            function playSound(type) {
                if(!audioInit) return;
                try {
                    const now = Tone.now();
                    if(type === 'hitNormal') synth.triggerAttackRelease("C5", "16n", now);
                    else if(type === 'hitSpecial') {
                        synth.triggerAttackRelease("E5", "16n", now);
                        synth.triggerAttackRelease("G5", "16n", now + 0.1);
                    }
                    else if(type === 'miss') memSynth.triggerAttackRelease("G2", "8n", now);
                    else if(type === 'spoof') noiseSynth.triggerAttackRelease("8n", now);
                    else if(type === 'over') synth.triggerAttackRelease("A3", "2n", now);
                    else if(type === 'combo') comboSynth.triggerAttackRelease("C6", "16n", now);
                } catch(e) {}
            }

            let score = 0, lives = 5, timeLeft = 0, currentDiff = 'normal';
            let isPlaying = false, isPaused = false;
            let gameLoopTimer, countdownTimer;
            let activeMoles = 0;
            let lastSpoofWord = "";
            let comboCount = 0;
            let multiplier = 1;

            const config = {
                normal: { duration: 30, minTime: 650, maxTime: 1200, specialChance: 0.15, maxMoles: 1 },
                hard: { duration: 25, minTime: 400, maxTime: 800, specialChance: 0.20, maxMoles: 3 }
            };

            // Setup Loaders & Cursors
            window.addEventListener('load', () => {
                setTimeout(() => {
                    splashScreen.style.opacity = '0';
                    setTimeout(() => splashScreen.style.display = 'none', 700);
                }, 1500);
                timeDisplay.textContent = config[currentDiff].duration;
            });

            // Hammer Tracking
            document.addEventListener('mousemove', (e) => {
                if(window.matchMedia("(pointer: fine)").matches) {
                    hammerCursor.style.left = e.clientX + 'px';
                    hammerCursor.style.top = e.clientY + 'px';
                }
            });
            const strikeHammer = () => hammerCursor.classList.add('strike');
            const liftHammer = () => hammerCursor.classList.remove('strike');
            document.addEventListener('mousedown', strikeHammer);
            document.addEventListener('mouseup', liftHammer);
            document.addEventListener('touchstart', strikeHammer, {passive: true});
            document.addEventListener('touchend', liftHammer, {passive: true});

            // Fullscreen Handle
            fullscreenBtn.addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
                    else document.exitFullscreen().catch(()=>{});
                } catch(err) { fullscreenBtn.style.display = 'none'; }
            });

            function updateLivesUI() {
                livesHearts.forEach((heart, i) => {
                    if (i < lives) heart.classList.remove('lost');
                    else heart.classList.add('lost');
                });
            }

            function updateCombo(reset = false) {
                if (reset) {
                    comboCount = 0;
                    multiplier = 1;
                    comboBadge.classList.remove('active');
                } else {
                    comboCount++;
                    if (comboCount >= 3) {
                        multiplier = Math.min(4, Math.floor(comboCount / 3) + 1); // Max 4x combo
                        comboText.textContent = `${multiplier}X`;
                        comboBadge.classList.add('active');
                        comboBadge.style.transform = 'translate(-50%, -50%) scale(1.2)';
                        setTimeout(() => comboBadge.style.transform = 'translate(-50%, -50%) scale(1)', 150);
                        playSound('combo');
                    }
                }
            }

            function spawnMole() {
                if (!isPlaying || isPaused) return;

                const openHoles = Array.from(holes).filter(h => !h.classList.contains('up') && h.dataset.locked !== 'true');
                if (openHoles.length === 0 || activeMoles >= config[currentDiff].maxMoles) {
                    gameLoopTimer = setTimeout(spawnMole, 200);
                    return;
                }

                const hole = openHoles[Math.floor(Math.random() * openHoles.length)];
                const img = hole.querySelector('.mole');
                const conf = config[currentDiff];

                let type = 'normal';
                let chance = Math.random();
                
                if (currentDiff === 'hard') {
                    if (chance < 0.20) type = 'spoof';
                    else if (chance < 0.40) type = 'special';
                } else {
                    if (chance < conf.specialChance) type = 'special';
                }

                hole.dataset.type = type;
                hole.dataset.locked = 'false'; 
                hole.classList.remove('whacked'); // reset state

                if (type === 'special') {
                    img.src = SPECIAL_IMG;
                    img.className = 'mole special';
                } else if (type === 'spoof') {
                    img.src = SPOOF_IMG;
                    img.className = 'mole spoof';
                } else {
                    img.src = NORMAL_IMG;
                    img.className = 'mole';
                }

                hole.classList.add('up');
                activeMoles++;

                // Dynamic Intensity: Gets faster as time runs out
                let timeProgressFactor = 0.4 + (0.6 * (timeLeft / conf.duration));
                if(currentDiff === 'hard') timeProgressFactor = Math.max(0.3, timeProgressFactor - 0.2); // Even faster
                
                const stayTime = Math.random() * (conf.maxTime * timeProgressFactor - conf.minTime * timeProgressFactor) + (conf.minTime * timeProgressFactor);
                
                setTimeout(() => {
                    if (hole.classList.contains('up') && !hole.classList.contains('whacked')) {
                        hole.classList.remove('up');
                        activeMoles--;
                    }
                }, stayTime);

                const nextTime = (Math.random() * 500 + 300) * timeProgressFactor;
                gameLoopTimer = setTimeout(spawnMole, nextTime);
            }

            function createFloatingText(x, y, text, typeClass) {
                const el = document.createElement('div');
                el.textContent = text;
                el.className = `hit-text ${typeClass}`;
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                wrapper.appendChild(el);
                setTimeout(() => el.remove(), 600);
            }

            function getHitWord() {
                let word;
                do { word = getRandomText(dict.funnyMiss); } while (word === lastSpoofWord);
                lastSpoofWord = word;
                return word;
            }

            function handleHit(e) {
                if (!isPlaying || isPaused) return;
                
                const hole = e.target.closest('.hole');
                if (!hole) return;

                // Ghost click guard
                if (hole.dataset.locked === 'true' || hole.classList.contains('whacked')) return;
                
                const rect = hole.getBoundingClientRect();
                const x = e.clientX || (e.touches ? e.touches[0].clientX : rect.left + rect.width/2);
                const y = e.clientY || (e.touches ? e.touches[0].clientY : rect.top + rect.height/2);

                hole.dataset.locked = 'true';
                
                if (hole.classList.contains('up')) {
                    hole.classList.add('whacked'); // Triggers squish animation
                    setTimeout(() => {
                        hole.classList.remove('up', 'whacked');
                        hole.dataset.locked = 'false';
                        activeMoles--;
                    }, 200);
                    
                    const type = hole.dataset.type;
                    if (type === 'spoof') {
                        updateCombo(true); // Break combo
                        score -= 5;
                        playSound('spoof');
                        createFloatingText(x, y, `-${getHitWord()}`, "hit-bad");
                        wrapper.classList.add('shake-hard');
                        setTimeout(() => wrapper.classList.remove('shake-hard'), 400);
                    } else {
                        updateCombo(false); // Build combo
                        const basePts = (type === 'special') ? 2 : 1;
                        const earnedPts = basePts * multiplier;
                        score += earnedPts;
                        
                        playSound(type === 'special' ? 'hitSpecial' : 'hitNormal');
                        
                        const textClass = multiplier > 1 ? "hit-combo" : (type === 'special' ? "hit-special" : "hit-normal");
                        const textMsg = multiplier > 1 ? `+${earnedPts} (x${multiplier})` : `+${earnedPts}`;
                        createFloatingText(x, y, textMsg, textClass);
                        
                        if(type === 'special') {
                            wrapper.classList.add('shake-screen');
                            setTimeout(() => wrapper.classList.remove('shake-screen'), 300);
                        }
                    }
                } else {
                    // Miss Penalty
                    updateCombo(true);
                    lives--;
                    score--;
                    playSound('miss');
                    createFloatingText(x, y, `-${getHitWord()}`, "hit-bad");
                    wrapper.classList.add('shake-screen');
                    setTimeout(() => wrapper.classList.remove('shake-screen'), 300);
                    updateLivesUI();

                    setTimeout(() => { hole.dataset.locked = 'false'; }, 200);

                    if (lives <= 0) endGame('dead');
                }
                
                scoreDisplay.textContent = score;
            }

            holes.forEach(hole => { hole.addEventListener('pointerdown', handleHit); });

            function startCountdown() {
                clearInterval(countdownTimer);
                countdownTimer = setInterval(() => {
                    if (!isPaused) {
                        timeLeft--;
                        timeDisplay.textContent = timeLeft;
                        
                        // Panic Mode
                        if(timeLeft <= 10) {
                            timeDisplay.classList.add('animate-pulse');
                            wrapper.classList.add('panic-mode');
                        } else {
                            wrapper.classList.remove('panic-mode');
                        }
                        
                        if (timeLeft <= 0) endGame('timeout');
                    }
                }, 1000);
            }

            function startGame() {
                initAudio();
                isPlaying = true;
                isPaused = false;
                score = 0;
                lives = 5;
                timeLeft = config[currentDiff].duration;
                activeMoles = 0;
                updateCombo(true); // Reset combo
                
                scoreDisplay.textContent = score;
                timeDisplay.textContent = timeLeft;
                timeDisplay.classList.remove('animate-pulse');
                wrapper.classList.remove('panic-mode');
                updateLivesUI();
                
                startBtn.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
                endBtn.classList.remove('hidden');
                diffBtns.forEach(b => b.disabled = true);

                holes.forEach(h => {
                    h.classList.remove('up', 'whacked');
                    h.dataset.locked = 'false';
                });

                startCountdown();
                spawnMole();
            }

            function togglePause() {
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? "Resume" : "Pause";
                pauseBtn.classList.toggle('bg-purple-500', isPaused);
                pauseBtn.classList.toggle('bg-blue-400', !isPaused);
            }

            function endGame(reason) {
                isPlaying = false;
                clearTimeout(gameLoopTimer);
                clearInterval(countdownTimer);
                timeDisplay.classList.remove('animate-pulse');
                wrapper.classList.remove('panic-mode');
                
                playSound('over');
                updateCombo(true);

                startBtn.classList.remove('hidden');
                pauseBtn.classList.add('hidden');
                endBtn.classList.add('hidden');
                pauseBtn.textContent = "Pause";
                pauseBtn.classList.remove('bg-purple-500');
                pauseBtn.classList.add('bg-blue-400');
                diffBtns.forEach(b => b.disabled = false);

                holes.forEach(h => h.classList.remove('up', 'whacked'));

                closeMsgBtn.textContent = getRandomText(dict.playAgain);
                finalScoreDisplay.textContent = score;
                
                // Dynamic End Screens
                if (reason === 'timeout' && score >= 40) {
                    msgTitle.textContent = getRandomText(dict.highScore);
                    msgTitle.className = "text-3xl font-black text-emerald-600 mb-3 animate-bounce";
                    popupLogo.src = SPECIAL_IMG;
                    msgTop.textContent = "Nee rishi ah";
                    msgBottom.textContent = "thadava adichiruka.";
                } else if (reason === 'timeout') {
                    msgTitle.textContent = getRandomText(dict.timeoutTitle);
                    msgTitle.className = "text-3xl font-black text-gray-800 mb-3";
                    popupLogo.src = NORMAL_IMG;
                    msgTop.textContent = getRandomText(dict.normalTop);
                    msgBottom.textContent = getRandomText(dict.normalBottom);
                } else if (reason === 'dead') {
                    msgTitle.textContent = getRandomText(dict.deadTitle);
                    msgTitle.className = "text-3xl font-black text-red-600 mb-3 animate-pulse drop-shadow-md";
                    popupLogo.src = SPOOF_IMG;
                    msgTop.textContent = getRandomText(dict.normalTop);
                    msgBottom.textContent = getRandomText(dict.deadBottom);
                } else if (reason === 'quit') {
                    msgTitle.textContent = getRandomText(dict.quitTitle);
                    msgTitle.className = "text-3xl font-black text-purple-600 mb-3";
                    popupLogo.src = NORMAL_IMG;
                    msgTop.textContent = getRandomText(dict.quitTextTop);
                    msgBottom.textContent = getRandomText(dict.quitTextBottom);
                }

                setTimeout(() => messageBox.classList.remove('hidden'), 500);
            }

            startBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', togglePause);
            endBtn.addEventListener('click', () => endGame('quit'));

            closeMsgBtn.addEventListener('click', () => {
                messageBox.classList.add('hidden');
                scoreDisplay.textContent = '0';
                timeDisplay.textContent = config[currentDiff].duration;
                lives = 5;
                updateLivesUI();
            });

            diffBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (isPlaying) return;
                    diffBtns.forEach(b => {
                        b.classList.remove('bg-emerald-500', 'text-white', 'shadow-xl', 'border-emerald-700');
                        b.classList.add('bg-white/50', 'text-emerald-900');
                    });
                    const target = e.target;
                    target.classList.add('bg-emerald-500', 'text-white', 'shadow-xl', 'border-emerald-700');
                    target.classList.remove('bg-white/50', 'text-emerald-900');
                    currentDiff = target.dataset.diff;
                    timeDisplay.textContent = config[currentDiff].duration;
                });
            });

        })();
    </script>
</body>
</html>
