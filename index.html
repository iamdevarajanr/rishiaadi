<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rishi a Adi!</title>
    <!-- Tailwind for layout, Tone.js for sounds -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
        }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: #fff; }

        #rishi-game-container {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100dvh;
            width: 100vw;
            max-width: 600px;
            margin: 0 auto;
            overflow: hidden;
            touch-action: none; 
            user-select: none;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        #splashScreen {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            z-index: 100000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            width: 100%;
            padding: 1rem;
            flex-grow: 1;
            align-content: center;
        }

        .hole {
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle, #3e2723 30%, #5c4033 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 15px rgba(0, 0, 0, 0.9), 0 4px 6px rgba(0,0,0,0.3);
            border: 4px solid #795548;
            cursor: pointer;
        }

        .mole {
            width: 100%;
            height: auto;
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.15s ease-out;
            border-radius: 50%;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.6);
            pointer-events: none; 
        }

        .hole.up .mole {
            bottom: 0%;
            transition: bottom 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
            cursor: pointer;
        }

        .mole.special {
            box-shadow: 0 0 25px 10px #f6e05e;
            border: 4px solid #f6e05e;
            background-color: #fffbeb;
        }

        .mole.spoof {
            box-shadow: 0 0 25px 10px #ef4444;
            border: 4px solid #ef4444;
            background-color: #fef2f2;
        }

        .hit-text {
            position: fixed;
            font-weight: 900;
            font-size: 3rem;
            pointer-events: none;
            z-index: 9999;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0px 4px 8px rgba(0,0,0,0.9);
            white-space: nowrap;
        }
        .hit-normal { color: #4ade80; } 
        .hit-special { color: #f6e05e; } 
        .hit-spoof { color: #ef4444; font-size: 2.5rem; } 
        .hit-miss { color: #f87171; font-size: 2rem; }

        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            40% { transform: translate(-50%, -80px) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -130px) scale(1); opacity: 0; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        #hammer {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            font-size: 5rem;
            transform-origin: bottom right; 
            transform: translate(-30%, -30%) rotate(0deg); 
            transition: transform 0.05s ease-out;
            display: none;
            filter: drop-shadow(6px 8px 10px rgba(0,0,0,0.6));
        }
        
        #hammer.strike {
            transform: translate(-40%, -20%) rotate(-55deg);
        }

        @media (pointer: coarse) {
            #hammer { display: none !important; }
        }
        @media (pointer: fine) {
            body, #rishi-game-container, .mole, .hole { cursor: none !important; }
            .btn, button { cursor: pointer !important; }
            #hammer { display: block; }
        }
    </style>
</head>
<body>

    <div id="rishi-game-container">
        
        <div id="splashScreen">
            <h1 class="text-6xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400 drop-shadow-lg text-center leading-tight">
                Rishi<br>a<br>Adi!
            </h1>
            <div class="relative w-48 h-48 rounded-full border-4 border-yellow-400 shadow-[0_0_30px_rgba(250,204,21,0.5)] bg-white overflow-hidden mb-8 animate-pulse">
                <img id="splashLogo" src="" alt="Logo" class="w-full h-full object-cover">
            </div>
            <p class="text-blue-300 font-bold tracking-widest uppercase animate-bounce">Loading Game...</p>
        </div>

        <button id="fullscreenBtn" class="absolute top-4 right-4 z-50 bg-slate-800/80 hover:bg-slate-700 text-white p-2.5 rounded-xl shadow-lg backdrop-blur-sm transition-all active:scale-95 cursor-pointer border border-slate-600">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        </button>

        <div class="w-full px-4 pt-6 pb-2 z-20 flex flex-col items-center">
            
            <div class="flex justify-between items-center w-full max-w-sm mb-4">
                <div class="flex flex-col items-start bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">
                    <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">High Score</span>
                    <span id="highScore" class="text-yellow-400 text-xl font-black">0</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold mb-1">Lives</span>
                    <div id="livesDisplay" class="text-xl flex gap-1">❤️❤️❤️❤️❤️</div>
                </div>
            </div>

            <div class="flex justify-between items-center w-full max-w-sm bg-slate-800/80 p-4 rounded-2xl shadow-lg border border-slate-700 mb-4">
                <div class="flex flex-col">
                    <span class="text-xs uppercase tracking-wider text-slate-400 font-bold">Score</span>
                    <span id="score" class="text-blue-400 text-4xl font-black">0</span>
                </div>
                
                <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400 leading-none text-center hidden sm:block">Rishi a Adi!</h1>

                <div class="flex flex-col items-end">
                    <span class="text-xs uppercase tracking-wider text-slate-400 font-bold">Time</span>
                    <span id="time" class="text-red-400 text-4xl font-black">0</span>
                </div>
            </div>
            
            <div class="flex gap-2 w-full max-w-sm mb-3">
                <button id="btn-normal" class="diff-btn flex-1 py-2 rounded-xl font-bold transition-all bg-blue-600 text-white shadow-md border-b-4 border-blue-800" data-diff="normal">Normal</button>
                <button id="btn-hard" class="diff-btn flex-1 py-2 rounded-xl font-bold transition-all bg-slate-700 text-slate-300 border-b-4 border-slate-900" data-diff="hard">Hard Mode</button>
            </div>

            <div class="flex gap-2 w-full max-w-sm">
                <button id="startBtn" class="btn flex-[2] bg-gradient-to-b from-green-400 to-emerald-600 hover:from-green-500 hover:to-emerald-700 text-white font-black py-3 px-4 rounded-xl shadow-lg transform transition active:scale-95 text-lg uppercase tracking-wide border-b-4 border-emerald-800">
                    Start Game
                </button>
                <button id="pauseBtn" disabled class="btn flex-1 bg-yellow-500 hover:bg-yellow-600 text-yellow-900 font-bold py-3 px-2 rounded-xl shadow-lg transition active:scale-95 text-sm uppercase flex items-center justify-center gap-1 border-b-4 border-yellow-700 opacity-50 cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Pause
                </button>
                <button id="endBtn" disabled class="btn flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-2 rounded-xl shadow-lg transition active:scale-95 text-sm uppercase flex items-center justify-center border-b-4 border-red-700 opacity-50 cursor-not-allowed">
                    End
                </button>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="hole" data-index="0"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="1"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="2"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="3"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="4"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="5"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="6"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="7"><img class="mole" alt="Mole" draggable="false" src=""></div>
            <div class="hole" data-index="8"><img class="mole" alt="Mole" draggable="false" src=""></div>
        </div>

        <div id="hammer">🔨</div>

        <div id="messageBox" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center hidden z-50 backdrop-blur-md px-4 text-center">
            
            <div class="relative w-40 h-40 rounded-full border-4 border-white shadow-[0_0_20px_rgba(255,255,255,0.3)] bg-white overflow-hidden mb-6 mt-[-60px]">
                <img id="modalLogo" src="" alt="Logo" class="w-full h-full object-cover">
            </div>

            <h2 id="msgTitle" class="text-4xl md:text-5xl font-black text-white mb-2 tracking-tight drop-shadow-md">Time's Up!</h2>
            
            <p id="scoreTextContainer" class="text-slate-300 mb-8 text-xl max-w-sm leading-relaxed">
                <span id="txtBeforeScore">You scored</span> <br>
                <span id="finalScore" class="font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400 text-7xl my-2 block drop-shadow-lg"></span> 
                <span id="txtAfterScore">points!</span>
            </p>
            
            <button id="closeMsgBtn" class="btn w-full max-w-xs bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-black py-4 px-4 rounded-xl transition text-lg uppercase tracking-wider shadow-lg active:scale-95 border-b-4 border-purple-800">
                Play Again
            </button>
        </div>

        <script>
            (() => {
                const NORMAL_IMG_URL = 'https://lh3.googleusercontent.com/d/1ROK5CKKC-Ae9s0vsbieqHafEQriSCeFz';
                const SPECIAL_IMG_URL = 'https://lh3.googleusercontent.com/d/1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH';
                const SPOOF_IMG_URL = 'https://lh3.googleusercontent.com/d/1gaLbrDvBw-rkPz8CNW5izBFSRFMuwXMN';
                const FALLBACK_IMG = 'https://placehold.co/150x150/4a5568/ffffff?text=Face';

                const img1 = new Image(); img1.src = NORMAL_IMG_URL;
                const img2 = new Image(); img2.src = SPECIAL_IMG_URL;
                const img3 = new Image(); img3.src = SPOOF_IMG_URL;

                // DOM Elements
                const splashScreen = document.getElementById('splashScreen');
                const splashLogo = document.getElementById('splashLogo');
                const modalLogo = document.getElementById('modalLogo');
                const holes = document.querySelectorAll('.hole');
                const scoreBoard = document.querySelector('#score');
                const highScoreBoard = document.querySelector('#highScore');
                const timeDisplay = document.querySelector('#time');
                const livesDisplay = document.querySelector('#livesDisplay');
                
                const startBtn = document.querySelector('#startBtn');
                const pauseBtn = document.querySelector('#pauseBtn');
                const endBtn = document.querySelector('#endBtn');
                
                const messageBox = document.querySelector('#messageBox');
                const msgTitle = document.querySelector('#msgTitle');
                const finalScoreDisplay = document.querySelector('#finalScore');
                const txtBeforeScore = document.querySelector('#txtBeforeScore');
                const txtAfterScore = document.querySelector('#txtAfterScore');
                const closeMsgBtn = document.querySelector('#closeMsgBtn');
                
                const diffBtns = document.querySelectorAll('.diff-btn');
                const hammer = document.getElementById('hammer');
                const fullscreenBtn = document.getElementById('fullscreenBtn');
                const gameContainer = document.getElementById('rishi-game-container');

                let timeUp = false;
                let isPaused = false;
                let score = 0;
                let highScore = 0;
                let timeLeft = 0;
                let lives = 5;
                let masterLoopTimeout;
                let activeTimeouts = new Set();
                let countdownInterval;
                let currentDifficulty = 'normal';
                let lastSpoofWord = "";

                // Settings: Notice Hard mode is very fast!
                const settings = {
                    normal: { duration: 30, minTime: 500, maxTime: 1000, specialChance: 0.15, spoofChance: 0, multiChance: 0 },
                    hard: { duration: 25, minTime: 300, maxTime: 650, specialChance: 0.30, spoofChance: 0.20, multiChance: 0.7 }
                };

                const normalSynth = new Tone.MembraneSynth().toDestination();
                const specialSynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" } }).toDestination();
                const spoofSynth = new Tone.FMSynth({
                    modulationIndex: 12.22,
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 },
                    oscillator: { type: "sawtooth" }
                }).toDestination();
                const missSynth = new Tone.MembraneSynth({ pitchDecay: 0.1, octaves: 1, oscillator: { type: "square" } }).toDestination();
                const gameOverSynth = new Tone.Synth({ oscillator: { type: "fmsquare", modulationType: "sawtooth", harmonicity: 0.5 } }).toDestination();

                function playNormalSound() { if (Tone.context.state === 'running') normalSynth.triggerAttackRelease("C4", "8n", "+0.05", 0.5); }
                function playSpecialSound() { if (Tone.context.state === 'running') specialSynth.triggerAttackRelease(["E4", "G4", "C5"], "8n", "+0.05", 0.3); }
                function playSpoofSound() { if (Tone.context.state === 'running') spoofSynth.triggerAttackRelease("C2", "4n", "+0.05", 0.8); }
                function playMissSound() { if (Tone.context.state === 'running') missSynth.triggerAttackRelease("G2", "8n", "+0.05", 0.3); }
                function playEndSound() { if (Tone.context.state === 'running') gameOverSynth.triggerAttackRelease("C3", "2n", "+0.05", 0.5); }

                setTimeout(() => {
                    splashLogo.src = SPECIAL_IMG_URL;
                    modalLogo.src = SPECIAL_IMG_URL;
                    splashScreen.style.opacity = '0';
                    setTimeout(() => { splashScreen.style.display = 'none'; }, 800);
                }, 1500);

                holes.forEach(hole => {
                    const img = hole.querySelector('.mole');
                    img.src = NORMAL_IMG_URL;
                    img.onerror = () => { img.src = FALLBACK_IMG; };
                });

                timeDisplay.textContent = settings[currentDifficulty].duration;

                fullscreenBtn.addEventListener('click', async () => {
                    try {
                        if (!document.fullscreenElement) {
                            if (gameContainer.requestFullscreen) await gameContainer.requestFullscreen();
                            else if (gameContainer.webkitRequestFullscreen) await gameContainer.webkitRequestFullscreen();
                        } else {
                            if (document.exitFullscreen) await document.exitFullscreen();
                            else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
                        }
                    } catch (err) {
                        fullscreenBtn.style.display = 'none'; // Hide if blocked by iframe policy
                    }
                });

                document.addEventListener('mousemove', (e) => {
                    if(window.matchMedia("(pointer: fine)").matches) {
                        hammer.style.left = e.clientX + 'px';
                        hammer.style.top = e.clientY + 'px';
                    }
                });

                const strikeHammer = () => hammer.classList.add('strike');
                const liftHammer = () => hammer.classList.remove('strike');

                document.addEventListener('mousedown', strikeHammer);
                document.addEventListener('mouseup', liftHammer);
                document.addEventListener('touchstart', strikeHammer, {passive: true});
                document.addEventListener('touchend', liftHammer, {passive: true});

                diffBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        if (!timeUp && startBtn.disabled) return; 
                        
                        diffBtns.forEach(b => {
                            b.className = 'diff-btn flex-1 py-2 rounded-xl font-bold transition-all bg-slate-700 text-slate-300 border-b-4 border-slate-900';
                        });
                        
                        const target = e.target;
                        target.className = 'diff-btn flex-1 py-2 rounded-xl font-bold transition-all bg-blue-600 text-white shadow-md border-b-4 border-blue-800';
                        
                        currentDifficulty = target.dataset.diff;
                        timeDisplay.textContent = settings[currentDifficulty].duration;
                    });
                });

                function randomTime(min, max) {
                    return Math.round(Math.random() * (max - min) + min);
                }

                function updateLivesDisplay() {
                    let hearts = '';
                    for(let i=0; i<5; i++) hearts += (i < lives) ? '❤️' : '🖤';
                    livesDisplay.textContent = hearts;
                }

                function spawnMole() {
                    if (timeUp || isPaused) return;

                    const availableHoles = Array.from(holes).filter(h => !h.classList.contains('up'));
                    if (availableHoles.length === 0) return;

                    const hole = availableHoles[Math.floor(Math.random() * availableHoles.length)];
                    const moleImg = hole.querySelector('.mole');
                    const time = randomTime(settings[currentDifficulty].minTime, settings[currentDifficulty].maxTime);
                    
                    const isSpecial = Math.random() < settings[currentDifficulty].specialChance;
                    const isSpoof = Math.random() < settings[currentDifficulty].spoofChance;
                    
                    if (isSpoof && currentDifficulty === 'hard') {
                        moleImg.src = SPOOF_IMG_URL;
                        moleImg.dataset.points = "-5";
                        moleImg.className = 'mole spoof';
                    } else if (isSpecial) {
                        moleImg.src = SPECIAL_IMG_URL;
                        moleImg.dataset.points = "2";
                        moleImg.className = 'mole special';
                    } else {
                        moleImg.src = NORMAL_IMG_URL;
                        moleImg.dataset.points = "1";
                        moleImg.className = 'mole';
                    }

                    hole.classList.add('up');
                    
                    const timeoutId = setTimeout(() => {
                        hole.classList.remove('up');
                        activeTimeouts.delete(timeoutId);
                    }, time);
                    activeTimeouts.add(timeoutId);
                }

                function peepLoop() {
                    if (timeUp || isPaused) return;
                    
                    spawnMole();
                    
                    if (Math.random() < settings[currentDifficulty].multiChance) {
                        spawnMole();
                        if (Math.random() < 0.3) spawnMole(); // 3 faces chance
                    }

                    const loopTime = randomTime(settings[currentDifficulty].minTime, settings[currentDifficulty].maxTime) * 0.8;
                    masterLoopTimeout = setTimeout(peepLoop, loopTime);
                }

                async function startGame() {
                    if (!timeUp && startBtn.disabled) return; 
                    
                    if (Tone.context.state !== 'running') await Tone.start();

                    scoreBoard.textContent = 0;
                    timeUp = false;
                    isPaused = false;
                    score = 0;
                    lives = 5;
                    updateLivesDisplay();
                    
                    startBtn.disabled = true;
                    startBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    
                    pauseBtn.disabled = false;
                    pauseBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    pauseBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Pause';
                    
                    endBtn.disabled = false;
                    endBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    
                    timeLeft = settings[currentDifficulty].duration;
                    timeDisplay.textContent = timeLeft;
                    timeDisplay.classList.remove('animate-pulse', 'text-red-600');
                    
                    peepLoop();

                    clearInterval(countdownInterval);
                    countdownInterval = setInterval(() => {
                        if(!isPaused) {
                            timeLeft--;
                            timeDisplay.textContent = timeLeft;
                            if(timeLeft <= 5 && timeLeft > 0) {
                                timeDisplay.classList.add('animate-pulse', 'text-red-600');
                            }
                            if(timeLeft <= 0) {
                                endGame('timeout');
                            }
                        }
                    }, 1000);
                }

                function togglePause() {
                    if (timeUp) return;
                    isPaused = !isPaused;
                    
                    if (isPaused) {
                        clearTimeout(masterLoopTimeout);
                        for (let t of activeTimeouts) clearTimeout(t);
                        pauseBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Resume';
                        pauseBtn.classList.replace('bg-yellow-500', 'bg-blue-500');
                        pauseBtn.classList.replace('border-yellow-700', 'border-blue-700');
                        pauseBtn.classList.replace('text-yellow-900', 'text-white');
                        holes.forEach(h => h.classList.remove('up')); 
                    } else {
                        pauseBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Pause';
                        pauseBtn.classList.replace('bg-blue-500', 'bg-yellow-500');
                        pauseBtn.classList.replace('border-blue-700', 'border-yellow-700');
                        pauseBtn.classList.replace('text-white', 'text-yellow-900');
                        peepLoop();
                    }
                }

                function endGame(reason = 'timeout') {
                    timeUp = true;
                    clearInterval(countdownInterval);
                    clearTimeout(masterLoopTimeout);
                    for (let t of activeTimeouts) clearTimeout(t);
                    activeTimeouts.clear();
                    
                    timeDisplay.classList.remove('animate-pulse');
                    timeDisplay.textContent = '0';
                    holes.forEach(h => h.classList.remove('up')); 
                    
                    startBtn.disabled = false;
                    startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    pauseBtn.disabled = true;
                    pauseBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    endBtn.disabled = true;
                    endBtn.classList.add('opacity-50', 'cursor-not-allowed');

                    if (score > highScore) {
                        highScore = score;
                        highScoreBoard.textContent = highScore;
                    }

                    playEndSound();

                    // Apply Custom Tamil/Tanglish Text based on how the game ended
                    if (reason === 'died') {
                        msgTitle.textContent = "Sethuta! 💔";
                        msgTitle.classList.replace('text-white', 'text-red-500');
                        txtBeforeScore.textContent = "5 thadava miss pannita! Total ah";
                        txtAfterScore.textContent = "adichiruka. Adika therila!";
                        closeMsgBtn.textContent = "Mudicha ena thirumba adi";
                    } else if (reason === 'ended') {
                        msgTitle.textContent = "Bayathagoli ! 🤣";
                        msgTitle.classList.replace('text-red-500', 'text-white');
                        txtBeforeScore.textContent = "Ena";
                        txtAfterScore.textContent = "thadava adichathukai bayanthu end koduthuta.";
                        closeMsgBtn.textContent = "Mudicha ena thirumba adi";
                    } else { // timeout
                        msgTitle.textContent = "Nee adichathu pothum!";
                        msgTitle.classList.replace('text-red-500', 'text-white');
                        txtBeforeScore.textContent = "Nee Rishi ah";
                        txtAfterScore.textContent = "thadava adichiruka!";
                        closeMsgBtn.textContent = "Mudicha ena thirumba adi";
                    }

                    setTimeout(() => {
                        finalScoreDisplay.textContent = score;
                        messageBox.classList.remove('hidden');
                    }, 300);
                }

                function handleBoardClick(e) {
                    if (timeUp || isPaused) return;

                    let target = e.target;
                    let hole = target.closest('.hole');
                    
                    if (!hole) return;

                    // Calculate Coordinates for floating text
                    let x = e.clientX;
                    let y = e.clientY;
                    if (e.touches && e.touches.length > 0) {
                        x = e.touches[0].clientX;
                        y = e.touches[0].clientY;
                    } else if (!x || !y) {
                        const rect = hole.getBoundingClientRect();
                        x = rect.left + rect.width / 2;
                        y = rect.top + rect.height / 2;
                    }

                    // Check if hit was a mole or a miss
                    if (target.classList.contains('mole') && hole.classList.contains('up')) {
                        // SUCCESSFUL HIT
                        const points = parseInt(target.dataset.points) || 1;
                        score += points;
                        scoreBoard.textContent = score;
                        
                        hole.classList.remove('up'); 

                        const hitText = document.createElement('div');
                        hitText.classList.add('hit-text');
                        
                        if (points > 1) {
                            hitText.textContent = `+${points}`;
                            playSpecialSound();
                            hitText.classList.add('hit-special');
                            gameContainer.classList.remove('shake');
                            void gameContainer.offsetWidth; 
                            gameContainer.classList.add('shake');
                        } else if (points < 0) {
                            // Non-repeating funny words array
                            const spoofWords = ["Aiyo -5!", "Venaam!", "Pochu!", "Goyyale!", "Thappu!", "Mokka!", "Paathu adi!", "Sothappal!", "Venna!", "Kandravi!"];
                            let word = lastSpoofWord;
                            
                            // Keep picking a random word until it's different from the last one
                            while (word === lastSpoofWord) {
                                word = spoofWords[Math.floor(Math.random() * spoofWords.length)];
                            }
                            lastSpoofWord = word;
                            
                            hitText.textContent = word;
                            playSpoofSound();
                            hitText.classList.add('hit-spoof');
                            gameContainer.classList.remove('shake');
                            void gameContainer.offsetWidth; 
                            gameContainer.classList.add('shake');
                        } else {
                            hitText.textContent = `+${points}`;
                            playNormalSound();
                            hitText.classList.add('hit-normal');
                        }
                        
                        hitText.style.left = `${x}px`;
                        hitText.style.top = `${y}px`;
                        document.body.appendChild(hitText);
                        setTimeout(() => hitText.remove(), 600);

                    } else {
                        // MISS (Hit hole, but mole was down or background)
                        lives--;
                        updateLivesDisplay();
                        playMissSound();

                        const funnyMissWords = ["Ayyo!", "Missu!", "Kaathu!", "Loosu!"];
                        const hitText = document.createElement('div');
                        hitText.classList.add('hit-text', 'hit-miss');
                        hitText.textContent = funnyMissWords[Math.floor(Math.random() * funnyMissWords.length)];
                        
                        hitText.style.left = `${x}px`;
                        hitText.style.top = `${y}px`;
                        document.body.appendChild(hitText);
                        setTimeout(() => hitText.remove(), 600);

                        gameContainer.classList.remove('shake');
                        void gameContainer.offsetWidth; 
                        gameContainer.classList.add('shake');

                        if(lives <= 0) {
                            endGame('died');
                        }
                    }
                }

                // Event listeners mapped to game board directly
                const gameBoardEl = document.getElementById('gameBoard');
                gameBoardEl.addEventListener('mousedown', handleBoardClick);
                gameBoardEl.addEventListener('touchstart', handleBoardClick, {passive: true});

                startBtn.addEventListener('click', startGame);
                pauseBtn.addEventListener('click', togglePause);
                endBtn.addEventListener('click', () => { if(!timeUp) endGame('ended'); });

                closeMsgBtn.addEventListener('click', () => {
                    messageBox.classList.add('hidden');
                    scoreBoard.textContent = '0';
                    timeDisplay.textContent = settings[currentDifficulty].duration;
                });

            })(); 
        </script>
    </div>
</body>
</html>
