<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rishi a Adi!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base page styling for PC - dark cinematic background */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111827; /* Dark gray/blue for outside the game */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The main app container */
        #rishi-game-container {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            /* Use 100dvh so mobile browser bars don't cause scrolling */
            height: 100dvh; 
            width: 100vw;
            max-width: 500px; /* Keeps it looking like a perfect phone app on PC */
            position: relative;
            overflow: hidden;
            touch-action: none; /* Prevents zooming/scrolling on mobile taps */
            user-select: none; /* Prevents text selection while playing */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        @media (min-width: 501px) {
            #rishi-game-container {
                height: 95vh;
                max-height: 850px;
                border-radius: 1.5rem;
            }
        }

        /* Flexible board that centers itself vertically */
        .board-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 1rem;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 10;
        }

        .hole {
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle, #3e2723 30%, #5c4033 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 15px rgba(0, 0, 0, 0.7), 0 4px 6px rgba(0,0,0,0.1);
            border: 4px solid #795548;
        }

        .mole {
            width: 75%;
            height: auto;
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.15s ease-out;
            border-radius: 50%;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.4);
            pointer-events: none; /* Parent hole handles clicks */
        }

        .hole.up .mole {
            bottom: 5%;
            transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto; /* Clickable only when up */
        }

        .mole.special {
            box-shadow: 0 0 20px 8px #f6e05e;
            border: 3px solid #f6e05e;
            background-color: #fffbeb;
        }

        /* Hit styling */
        .hit-text {
            position: fixed; /* Fixed to window to float above everything */
            font-weight: 900;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 9999;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0px 3px 6px rgba(0,0,0,0.8);
        }
        .hit-normal { color: #4ade80; } /* Green */
        .hit-special { color: #f6e05e; } /* Yellow */

        /* New Shake Animation for engagement */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
            50% { transform: translate(-50%, -80px) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -120px) scale(1); opacity: 0; }
        }

        /* Hammer custom cursor for desktop */
        #hammer {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            font-size: 4rem;
            transform-origin: bottom right; 
            transform: translate(-30%, -30%) rotate(0deg); 
            transition: transform 0.05s ease-out;
            display: none;
            filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.4));
        }
        
        #hammer.strike {
            transform: translate(-40%, -20%) rotate(-55deg);
        }

        /* Hide hammer on touch devices */
        @media (pointer: coarse) {
            #hammer { display: none !important; }
            .hole.up .mole { cursor: pointer; }
        }
        /* Show hammer on fine pointers (mouse) */
        @media (pointer: fine) {
            #rishi-game-container, .game-board, .mole, .hole { cursor: none; }
            .btn, button { cursor: pointer; }
            #hammer { display: block; }
        }

        @media (max-width: 380px) {
            .game-board { gap: 0.5rem; }
            .hole { border-width: 2px; }
            h1 { font-size: 2rem !important; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen (Loading Page) -->
    <div id="splashScreen" class="fixed inset-0 bg-gray-900 z-[999999] flex flex-col items-center justify-center transition-opacity duration-700 ease-in-out">
        <div class="relative flex flex-col items-center animate-pulse">
            <img src="https://lh3.googleusercontent.com/d/1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH" alt="Logo" class="w-32 h-32 md:w-40 md:h-40 rounded-full border-4 border-yellow-400 shadow-[0_0_30px_rgba(246,224,94,0.6)] mb-6 object-cover bg-yellow-50">
            <h1 class="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400 tracking-tight drop-shadow-lg text-center">
                Rishi a Adi!
            </h1>
            <div class="mt-8 flex items-center justify-center space-x-2">
                <div class="w-3 h-3 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0s;"></div>
                <div class="w-3 h-3 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
                <div class="w-3 h-3 bg-green-500 rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
            </div>
        </div>
    </div>

    <div id="rishi-game-container">
        
        <!-- Fullscreen Button -->
        <button id="fullscreenBtn" class="absolute top-4 right-4 z-50 bg-white/60 hover:bg-white/90 text-gray-800 p-2.5 rounded-xl shadow-md backdrop-blur-sm transition-all active:scale-95 cursor-pointer" title="Toggle Fullscreen">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        </button>

        <!-- Header area (Title, Score, Settings) -->
        <div class="px-6 pt-8 pb-2 flex flex-col items-center w-full relative z-20">
            <h1 class="text-4xl md:text-5xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-500 tracking-tight drop-shadow-md text-center w-full">
                Rishi a Adi!
            </h1>
            
            <div class="flex justify-between items-center w-full max-w-sm mb-3 px-2 bg-white/40 rounded-xl p-2 shadow-sm backdrop-blur-sm">
                <div class="flex flex-col items-center flex-1">
                    <span class="text-[10px] uppercase tracking-wider text-gray-500 font-bold">High Score</span>
                    <span id="highScore" class="text-purple-600 text-xl font-black">0</span>
                </div>
                <div class="flex flex-col items-center flex-1 border-x border-gray-300/50">
                    <span class="text-xs uppercase tracking-wider text-gray-500 font-bold">Score</span>
                    <span id="score" class="text-blue-600 text-3xl font-black">0</span>
                </div>
                <div class="flex flex-col items-center flex-1">
                    <span class="text-xs uppercase tracking-wider text-gray-500 font-bold">Time</span>
                    <span id="time" class="text-red-500 text-3xl font-black">0</span>
                </div>
            </div>
            
            <div class="flex gap-2 w-full max-w-sm bg-gray-200/60 p-1.5 rounded-xl backdrop-blur-sm mb-3">
                <button id="btn-normal" class="diff-btn flex-1 py-1.5 rounded-lg font-bold transition-all bg-blue-500 text-white shadow-md text-sm" data-diff="normal">Normal</button>
                <button id="btn-hard" class="diff-btn flex-1 py-1.5 rounded-lg font-bold transition-all text-gray-500 hover:bg-gray-300 text-sm" data-diff="hard">Hard</button>
            </div>

            <div class="flex gap-2 w-full max-w-sm">
                <button id="pauseBtn" class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-2 rounded-xl shadow-md transition-all active:scale-95 flex justify-center items-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed text-[11px] sm:text-sm" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Pause
                </button>
                <button id="restartBtn" class="flex-1 bg-gray-700 hover:bg-gray-800 text-white font-bold py-2 rounded-xl shadow-md transition-all active:scale-95 flex justify-center items-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed text-[11px] sm:text-sm" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Restart
                </button>
                <button id="endBtn" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-xl shadow-md transition-all active:scale-95 flex justify-center items-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed text-[11px] sm:text-sm" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg> End
                </button>
            </div>
        </div>

        <!-- Board Area (Flexed to center perfectly) -->
        <div class="board-wrapper">
            <div class="game-board" id="gameBoard">
                <div class="hole" data-index="0"><img class="mole" alt="Mole" draggable="false" src=""></div>
                <div class="hole" data-index="1"><img class="mole" alt="Mole" draggable="false" src=""></div>
                <div class="hole" data-index="2"><img class="mole" alt="Mole" draggable="false" src=""></div>
                <div class="hole" data-index="3"><img class="mole" alt="Mole" draggable="false" src=""></div>
                <div class="hole" data-index="4"><img class="mole" alt="Mole" draggable="false" src=""></div>
                <div class="hole" data-index="5"><img class="mole" alt="Mole" draggable="false" src=""></div>
                <div class="hole" data-index="6"><img class="mole" alt="Mole" draggable="false" src=""></div>
                <div class="hole" data-index="7"><img class="mole" alt="Mole" draggable="false" src=""></div>
                <div class="hole" data-index="8"><img class="mole" alt="Mole" draggable="false" src=""></div>
            </div>
        </div>

        <!-- Footer Area -->
        <div class="px-6 pb-8 pt-2 w-full flex justify-center relative z-20">
            <button id="startBtn" class="btn w-full max-w-sm bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white font-black py-4 px-6 rounded-xl shadow-lg transform transition active:scale-95 text-xl uppercase tracking-wide">
                Start Game
            </button>
        </div>

        <!-- Pop-up Message Box (Locked inside container) -->
        <div id="messageBox" class="absolute inset-0 bg-gray-900 bg-opacity-80 flex items-center justify-center hidden z-50 backdrop-blur-sm px-4">
            <div class="bg-white rounded-3xl p-8 max-w-xs w-full text-center shadow-2xl transform transition-all scale-100 border-4 border-blue-500">
                <img src="https://lh3.googleusercontent.com/d/1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH" alt="Special Mole Logo" class="w-24 h-24 mx-auto mb-4 rounded-full border-4 border-yellow-400 shadow-md object-cover bg-yellow-50">
                <h2 id="endTitle" class="text-4xl font-black text-gray-800 mb-2">nee adichathu pothum</h2>
                <p id="scoreTextContainer" class="text-gray-600 mb-6 text-xl leading-snug">nee rishi ah <br><span id="finalScore" class="font-black text-blue-600 text-6xl my-2 block"></span> adichiruka</p>
                <button id="closeMsgBtn" class="btn w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-2 rounded-xl transition text-[15px] uppercase tracking-wide shadow-lg active:scale-95">
                    mudicha ena thirumba adi
                </button>
            </div>
        </div>
    </div>

    <!-- Hammer Element -->
    <div id="hammer">🔨</div>

    <script>
        (() => {
            // Setup global image variables immediately to avoid errors
            const NORMAL_IMG_URL = 'https://lh3.googleusercontent.com/d/1ROK5CKKC-Ae9s0vsbieqHafEQriSCeFz';
            const SPECIAL_IMG_URL = 'https://lh3.googleusercontent.com/d/1gtZY6ewjDZdUVvURLSBCsZ_hA0gVNPYH';
            const FALLBACK_IMG = 'https://placehold.co/150x150/4a5568/ffffff?text=Face';

            // Preload images to prevent lag on first pop
            const img1 = new Image(); img1.src = NORMAL_IMG_URL;
            const img2 = new Image(); img2.src = SPECIAL_IMG_URL;

            // DOM Elements
            const holes = document.querySelectorAll('.hole');
            const scoreBoard = document.querySelector('#score');
            const highScoreDisplay = document.querySelector('#highScore');
            const timeDisplay = document.querySelector('#time');
            const startBtn = document.querySelector('#startBtn');
            const pauseBtn = document.querySelector('#pauseBtn');
            const restartBtn = document.querySelector('#restartBtn');
            const endBtn = document.querySelector('#endBtn');
            const messageBox = document.querySelector('#messageBox');
            const endTitle = document.querySelector('#endTitle');
            const finalScoreDisplay = document.querySelector('#finalScore');
            const scoreTextContainer = document.querySelector('#scoreTextContainer');
            const closeMsgBtn = document.querySelector('#closeMsgBtn');
            const diffBtns = document.querySelectorAll('.diff-btn');
            const hammer = document.getElementById('hammer');
            
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const splashScreen = document.getElementById('splashScreen');

            // Fullscreen Logic for the body wrapper (with Permission Catch)
            fullscreenBtn.addEventListener('click', () => {
                try {
                    const elem = document.documentElement;
                    if (!document.fullscreenElement) {
                        let requestPromise;
                        if (elem.requestFullscreen) {
                            requestPromise = elem.requestFullscreen();
                        } else if (elem.webkitRequestFullscreen) {
                            requestPromise = elem.webkitRequestFullscreen(); // Safari
                        }
                        
                        // If it returns a promise, catch any permission rejections
                        if (requestPromise !== undefined) {
                            requestPromise.catch(err => {
                                console.warn("Fullscreen API is blocked in this embedded environment:", err);
                                // Hide the button since it cannot be used here
                                fullscreenBtn.style.display = 'none';
                            });
                        }
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); // Safari
                    }
                } catch (error) {
                    console.warn("Fullscreen action failed:", error);
                }
            });

            // Game State
            let lastHole;
            let timeUp = false;
            let isPaused = false;
            let score = 0;
            let highScore = 0;
            let timeLeft = 0;
            let currentMoleTimeout;
            let countdownInterval;
            let currentDifficulty = 'normal';

            const settings = {
                normal: { duration: 30, minTime: 600, maxTime: 1200, specialChance: 0.15 },
                hard: { duration: 20, minTime: 300, maxTime: 700, specialChance: 0.30 }
            };

            const normalSynth = new Tone.MembraneSynth().toDestination();
            const specialSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" }
            }).toDestination();
            const gameOverSynth = new Tone.Synth({
                oscillator: { type: "sine" },
                envelope: { attack: 0.1, decay: 0.2, sustain: 1, release: 1 }
            }).toDestination();

            function playNormalSound() {
                if (Tone.context.state === 'running') normalSynth.triggerAttackRelease("C2", "8n", "+0.05", 0.8);
            }
            function playSpecialSound() {
                if (Tone.context.state === 'running') specialSynth.triggerAttackRelease(["E4", "G4", "C5"], "8n", "+0.05", 0.5);
            }
            function playEndSound() {
                if (Tone.context.state === 'running') gameOverSynth.triggerAttackRelease("C3", "1n");
            }

            // Initialize placeholder images
            holes.forEach(hole => {
                const img = hole.querySelector('.mole');
                img.src = NORMAL_IMG_URL;
                img.onerror = () => { img.src = FALLBACK_IMG; };
            });

            timeDisplay.textContent = settings[currentDifficulty].duration;

            // Hammer logic
            document.addEventListener('mousemove', (e) => {
                if(window.matchMedia("(pointer: fine)").matches) {
                    hammer.style.left = e.clientX + 'px';
                    hammer.style.top = e.clientY + 'px';
                }
            });

            const strikeHammer = () => hammer.classList.add('strike');
            const liftHammer = () => hammer.classList.remove('strike');

            document.addEventListener('mousedown', strikeHammer);
            document.addEventListener('mouseup', liftHammer);
            document.addEventListener('touchstart', strikeHammer, {passive: true});
            document.addEventListener('touchend', liftHammer, {passive: true});

            // Difficulty Buttons
            diffBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (!timeUp && startBtn.disabled) return;
                    
                    diffBtns.forEach(b => {
                        b.classList.remove('bg-blue-500', 'text-white', 'shadow-md');
                        b.classList.add('text-gray-500');
                    });
                    
                    const target = e.target;
                    target.classList.add('bg-blue-500', 'text-white', 'shadow-md');
                    target.classList.remove('text-gray-500');
                    
                    currentDifficulty = target.dataset.diff;
                    timeDisplay.textContent = settings[currentDifficulty].duration;
                });
            });

            function randomTime(min, max) {
                return Math.round(Math.random() * (max - min) + min);
            }

            function randomHole(holesList) {
                const idx = Math.floor(Math.random() * holesList.length);
                const hole = holesList[idx];
                if (hole === lastHole) return randomHole(holesList);
                lastHole = hole;
                return hole;
            }

            function peep() {
                if (timeUp || isPaused) return;
                
                const time = randomTime(settings[currentDifficulty].minTime, settings[currentDifficulty].maxTime);
                const hole = randomHole(holes);
                const moleImg = hole.querySelector('.mole');
                
                const isSpecial = Math.random() < settings[currentDifficulty].specialChance;
                
                if (isSpecial) {
                    moleImg.src = SPECIAL_IMG_URL;
                    moleImg.dataset.points = "2";
                    moleImg.classList.add('special');
                } else {
                    moleImg.src = NORMAL_IMG_URL;
                    moleImg.dataset.points = "1";
                    moleImg.classList.remove('special');
                }

                hole.classList.add('up');
                
                currentMoleTimeout = setTimeout(() => {
                    hole.classList.remove('up');
                    if (!timeUp && !isPaused) peep();
                }, time);
            }

            async function startGame() {
                if (!timeUp && startBtn.disabled && !isPaused) return;
                
                // Starts the browser's audio engine on first click
                await Tone.start();

                scoreBoard.textContent = 0;
                timeUp = false;
                isPaused = false;
                score = 0;
                timeLeft = settings[currentDifficulty].duration;
                
                startBtn.disabled = true;
                startBtn.classList.add('opacity-50', 'cursor-not-allowed');
                pauseBtn.disabled = false;
                restartBtn.disabled = false;
                endBtn.disabled = false;
                
                timeDisplay.textContent = timeLeft;
                timeDisplay.classList.remove('animate-pulse');
                
                peep();

                clearInterval(countdownInterval);
                countdownInterval = setInterval(() => {
                    if (isPaused) return;
                    timeLeft--;
                    timeDisplay.textContent = timeLeft;
                    
                    if(timeLeft <= 5 && timeLeft > 0) {
                        timeDisplay.classList.add('animate-pulse');
                    }
                    
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 1000);
            }

            function endGame(showModal = true, manuallyEnded = false) {
                timeUp = true;
                clearInterval(countdownInterval);
                clearTimeout(currentMoleTimeout);
                timeDisplay.classList.remove('animate-pulse');
                timeDisplay.textContent = '0';
                
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                pauseBtn.disabled = true;
                restartBtn.disabled = true;
                endBtn.disabled = true;
                
                isPaused = false;
                pauseBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Pause';
                pauseBtn.classList.replace('bg-green-400', 'bg-yellow-400');
                pauseBtn.classList.replace('text-green-900', 'text-yellow-900');
                
                holes.forEach(h => h.classList.remove('up'));
                
                if (score > highScore) {
                    highScore = score;
                    highScoreDisplay.textContent = highScore;
                }
                
                if (showModal) {
                    playEndSound();
                    
                    // Dynamic text replacement based on how the game ended
                    if (manuallyEnded) {
                        endTitle.textContent = "bayathagoli !";
                        scoreTextContainer.innerHTML = `ena <br><span id="finalScore" class="font-black text-blue-600 text-6xl my-2 block">${score}</span> thadava adichathukai bayanthu end koduthuta`;
                    } else {
                        endTitle.textContent = "nee adichathu pothum";
                        scoreTextContainer.innerHTML = `nee rishi ah <br><span id="finalScore" class="font-black text-blue-600 text-6xl my-2 block">${score}</span> adichiruka`;
                    }

                    setTimeout(() => {
                        messageBox.classList.remove('hidden');
                    }, 500);
                } else {
                    scoreBoard.textContent = '0';
                    timeDisplay.textContent = settings[currentDifficulty].duration;
                }
            }

            function togglePause() {
                if (timeUp) return;
                isPaused = !isPaused;
                
                if (isPaused) {
                    clearTimeout(currentMoleTimeout);
                    pauseBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Resume';
                    pauseBtn.classList.replace('bg-yellow-400', 'bg-green-400');
                    pauseBtn.classList.replace('text-yellow-900', 'text-green-900');
                    holes.forEach(h => h.classList.remove('up')); 
                } else {
                    pauseBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Pause';
                    pauseBtn.classList.replace('bg-green-400', 'bg-yellow-400');
                    pauseBtn.classList.replace('text-green-900', 'text-yellow-900');
                    peep();
                }
            }

            function whack(e) {
                const mole = e.target;
                const hole = mole.parentNode;
                
                if (!hole.classList.contains('up')) return;
                
                const points = parseInt(mole.dataset.points) || 1;
                score += points;
                scoreBoard.textContent = score;
                
                hole.classList.remove('up'); 

                const hitText = document.createElement('div');
                hitText.textContent = `+${points}`;
                hitText.classList.add('hit-text');
                
                if (points > 1) {
                    playSpecialSound();
                    hitText.classList.add('hit-special');
                    // Add an engaging screen shake when hitting a special mole
                    const board = document.querySelector('.game-board');
                    board.classList.remove('shake');
                    void board.offsetWidth; // Trigger instant CSS refresh
                    board.classList.add('shake');
                } else {
                    playNormalSound();
                    hitText.classList.add('hit-normal');
                }
                
                let x = e.clientX;
                let y = e.clientY;
                
                if (e.touches && e.touches.length > 0) {
                    x = e.touches[0].clientX;
                    y = e.touches[0].clientY;
                } else if (!x || !y) {
                    const rect = mole.getBoundingClientRect();
                    x = rect.left + rect.width / 2;
                    y = rect.top + rect.height / 2;
                }

                hitText.style.left = `${x}px`;
                hitText.style.top = `${y}px`;
                document.body.appendChild(hitText);
                
                setTimeout(() => {
                    hitText.remove();
                }, 600);
            }

            holes.forEach(hole => {
                const mole = hole.querySelector('.mole');
                mole.addEventListener('mousedown', whack);
                mole.addEventListener('touchstart', whack, {passive: true});
            });

            startBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', togglePause);
            restartBtn.addEventListener('click', async () => {
                await Tone.start();
                endGame(false); // End game without showing popup modal
                setTimeout(startGame, 50); // Instantly reboot
            });
            endBtn.addEventListener('click', () => {
                endGame(true, true); // True flags for opening modal and indicating it was forced ended
            });

            closeMsgBtn.addEventListener('click', () => {
                messageBox.classList.add('hidden');
                scoreBoard.textContent = '0';
                timeDisplay.textContent = settings[currentDifficulty].duration;
            });

            // Handle Splash Screen Removal
            window.addEventListener('load', () => {
                // Wait 1.5 seconds to show the loading screen, then fade out
                setTimeout(() => {
                    splashScreen.style.opacity = '0';
                    setTimeout(() => {
                        splashScreen.style.display = 'none';
                    }, 700); // Waits for the CSS fade transition to finish
                }, 1500);
            });

        })();
    </script>
</body>
</html>
