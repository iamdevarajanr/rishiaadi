    <!-- Dynamic Manifest Placeholder (Generated by JS to bypass Chrome restrictions) -->
    <link id="dynamic-manifest" rel="manifest">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0; 
            padding: 0;
            background-color: #111827; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; 
            width: 100vw;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            touch-action: none; /* Prevents pull-to-refresh on mobile */
            user-select: none;
            -webkit-user-select: none;
        }

        #app-wrapper {
            width: 100%;
            max-width: 550px; 
            height: 100dvh; 
            background: linear-gradient(135deg, #a7f3d0 0%, #34d399 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }

        #app-wrapper.hard-mode { background: linear-gradient(135deg, #fbcfe8 0%, #f43f5e 100%); }
        #app-wrapper.panic-mode { background: linear-gradient(135deg, #fca5a5 0%, #dc2626 100%); }

        /* PC View: Makes it look like an iPad app on desktop */
        @media (min-width: 600px) {
            #app-wrapper {
                height: 95dvh;
                max-height: 900px;
                border-radius: 2.5rem;
                border: 10px solid white;
                box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            }
        }

        /* Responsive Layout Engine */
        .ui-header { flex: 0 0 auto; padding: 15px 15px 5px 15px; z-index: 20; }
        .controls-section { flex: 0 0 auto; padding: 0 15px 10px 15px; z-index: 20; }
        
        .board-container {
            flex: 1 1 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            min-height: 0; /* CRITICAL for flex children to not overflow */
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            /* Magic Formula: Keeps it perfectly square and forces it to fit screen */
            width: min(100%, 55vh);
            aspect-ratio: 1 / 1;
            background-color: rgba(0,0,0,0.1);
            padding: 15px;
            border-radius: 2rem;
            box-shadow: inset 0 8px 20px rgba(0,0,0,0.2);
        }

        .hole {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #271c19 30%, #4a332a 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 15px 25px rgba(0, 0, 0, 0.9), 0 4px 6px rgba(0,0,0,0.3);
            border: 6px solid #8d6e63;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .mole {
            width: 95%;
            height: 95%;
            object-fit: contain; 
            position: absolute;
            bottom: -110%;
            left: 2.5%;
            transition: bottom 0.15s ease-out, transform 0.1s;
            pointer-events: none; 
        }

        .hole.up .mole {
            bottom: -2%;
            /* Bouncy Animation */
            transition: bottom 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .hole.whacked .mole {
            transform: scale(0.4) translateY(60%);
            filter: brightness(0.4) sepia(1);
        }

        .mole.special { filter: drop-shadow(0 -5px 20px #f59e0b) saturate(1.5); }
        .mole.spoof { filter: grayscale(20%) sepia(50%) hue-rotate(320deg) contrast(1.3) drop-shadow(0 0 10px red); }

        /* Floating Score Text */
        .hit-text {
            position: absolute;
            font-weight: 900;
            pointer-events: none;
            z-index: 50;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0px 4px 8px rgba(0,0,0,0.9);
            white-space: nowrap;
        }
        .hit-normal { color: #fff; font-size: 3rem; } 
        .hit-special { color: #fde047; font-size: 3.5rem; } 
        .hit-bad { color: #ef4444; font-size: 2.5rem; }

        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -100px) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -150px) scale(1); opacity: 0; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px) rotate(-4deg); }
            50% { transform: translateX(15px) rotate(4deg); }
            75% { transform: translateX(-15px) rotate(-4deg); }
        }
        .shake-screen { animation: shake 0.3s ease-in-out; }
        .shake-hard { animation: shake 0.4s ease-in-out; }

        .heart { font-size: 1.5rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); transition: all 0.3s; }
        .heart.lost { opacity: 0.2; filter: grayscale(100%); transform: scale(0.7); }
        
        /* PC Hammer Cursor */
        #hammer-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 5rem;
            transform-origin: bottom right; 
            transform: translate(-30%, -30%) rotate(0deg); 
            transition: transform 0.05s ease-out;
            display: none;
            filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.5));
        }
        #hammer-cursor.strike { transform: translate(-40%, -20%) rotate(-60deg); }
        @media (pointer: coarse) { #hammer-cursor { display: none !important; } }
        @media (pointer: fine) {
            #app-wrapper, .hole { cursor: none !important; }
            button, .btn { cursor: pointer !important; }
            #hammer-cursor { display: block; }
        }
    </style>
</head>

    <script>

            // Preload
            [NORMAL_IMG, SPECIAL_IMG, SPOOF_IMG].forEach(src => { 
                const img = new Image(); 
                img.referrerPolicy = "no-referrer";
                img.src = src; 
            });

            // UI Elements
            const wrapper = document.getElementById('app-wrapper');
            const splashScreen = document.getElementById('splashScreen');
            const holes = document.querySelectorAll('.hole');
            
            const scoreDisplay = document.getElementById('score');
            const timeDisplay = document.getElementById('time');
            const livesHearts = document.querySelectorAll('.heart');
            const highScoreDisplay = document.getElementById('highScoreDisplay');
            
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const endBtn = document.getElementById('endBtn');
            const diffBtns = document.querySelectorAll('.diff-btn');
            const hammerCursor = document.getElementById('hammer-cursor');
            
            // Popup Elements
            const messageBox = document.getElementById('messageBox');
            const popupLogo = document.getElementById('popupLogo');
            const msgTitle = document.getElementById('msgTitle');
            const msgTop = document.getElementById('msgTop');
            const msgBottom = document.getElementById('msgBottom');
            const finalScoreDisplay = document.getElementById('finalScore');
            const closeMsgBtn = document.getElementById('closeMsgBtn');
            const highScoreBadge = document.getElementById('highScoreBadge');

            const dict = {
                highScore: [
                    "Periya pudingi than!", "Verithanam!", "Aathadi, sema adi!", "Rishi azhuguraan!", 
                    "Thalaivaa super!", "Kizhichita po!", "Marana Mass!", "Unna adikka aale illa!", 
                    "Pinita po boss!", "Adi dhool!", "Fire ah irukka!"
                ],
                timeoutTitle: [
                    "Nee adichathu pothum.", "Time mudinjithu!", "Aatam Over!", "Pothum da saami!", 
                    "Kaipulla tired aagita!", "Nimirnthu paru!", "Kai valikithaa?", "Moochu vangutha?", 
                    "Soththu moottai!"
                ],
                quitTitle: [
                    "Bayathagoli !", "Oditaya?", "Saththam ilama poita!", "Enna bayama?", "Odatha nillu!", 
                    "Suruttu vizhunthucha?", "Dhairiyam illaya?", "Payanthankulli!"
                ],
                quitTextTop: ["Ena", "Enna pa", "Ada", "Acho", "Ayayyo", "Yov", "Che", "Paavam"],
                quitTextBottom: [
                    "thadava adichathukai bayanthu end koduthuta.", "adichathuke bayanthutiya?", 
                    "podhum nu oditiya?", "adi kooda thaanga matiya?", "points eduthutu escape ah?"
                ],
                normalTop: [
                    "Nee rishi ah", "Unnala", "Summa", "Kevalam", "Romba srama pattu", 
                    "Eppadiyo mukki", "Oru valiya", "Poraadi"
                ],
                normalBottom: [
                    "thadava adichiruka.", "adi dhaan adika mudinjithu.", "point than eduthuka.", 
                    "thadava adi vaangitaan.", "points eduthuruka."
                ],
                deadTitle: [
                    "Oolara Vitta!", "Sothappal!", "Kaanavitta!", "Gaali!", "Sema bulb!", 
                    "Katha mudinjithu!", "Avasara kudukkai!", "Goyyale out!", "Muttu sandhu!"
                ],
                deadBottom: [
                    "adichitu life ellam tholachita.", "points eduthutu out aagita.", 
                    "adichathukulla life gaali.", "points ku asai pattu gaali aagita."
                ],
                funnyMiss: [
                    "Ayyo!", "Miss!", "Kaathu!", "Loosu!", "Goyyale!", "Venna!", 
                    "Sothappal!", "Bulb!", "Arivu ketta!", "Kuruvi!", "Mokka!"
                ],
                playAgain: [
                    "Mudicha ena thirumba adi", "Dhairiyam iruntha vaa", "Innum adikanuma?", 
                    "Thirumba try panriya?", "Vaa da paakalam", "Restart pannu boss", 
                    "Innoru aatam podlama?", "Gethu iruntha thirumba aadu"
                ]
            };

            let lastRandomWords = {};
            function getRandomText(category, array) { 
                let word;
                do { word = array[Math.floor(Math.random() * array.length)]; } 
                while (word === lastRandomWords[category] && array.length > 1);
                lastRandomWords[category] = word;
                return word;
            }

            // High Score System via LocalStorage
            let storedHighScore = parseInt(localStorage.getItem('rishiHighScore')) || 0;
            highScoreDisplay.textContent = storedHighScore;

            let synth, memSynth, noiseSynth;
            let audioInit = false;

            function initAudio() {
                if(audioInit) return;
                try {
                    Tone.start();
                    synth = new Tone.Synth({ oscillator: { type: 'triangle' } }).toDestination();
                    memSynth = new Tone.MembraneSynth({ pitchDecay: 0.1, octaves: 4 }).toDestination();
                    noiseSynth = new Tone.NoiseSynth({
                        noise: { type: 'pink' },
                        envelope: { attack: 0.01, decay: 0.3, sustain: 0 }
                    }).toDestination();
                    audioInit = true;
                } catch(e) { console.log("Audio skipped"); }
            }

            function playSound(type) {
                if(!audioInit) return;
                try {
                    const now = Tone.now();
                    if(type === 'hitNormal') synth.triggerAttackRelease("C5", "16n", now);
                    else if(type === 'hitSpecial') {
                        synth.triggerAttackRelease("E5", "16n", now);
                        synth.triggerAttackRelease("G5", "16n", now + 0.1);
                    }
                    else if(type === 'miss') memSynth.triggerAttackRelease("G2", "8n", now); 
                    else if(type === 'spoof') {
                        noiseSynth.triggerAttackRelease("8n", now);
                        synth.triggerAttackRelease("C2", "8n", now + 0.1);
                    }
                    else if(type === 'over') synth.triggerAttackRelease("A3", "2n", now);
                } catch(e) {}
            }

            let score = 0, lives = 5, timeLeft = 0, currentDiff = 'normal';
            let isPlaying = false, isPaused = false;
            let gameLoopTimer, countdownTimer;
            let activeMoles = 0;

            const config = {
                // Perfected Difficulty
                normal: { duration: 30, minTime: 650, maxTime: 1100, specialChance: 0.20, maxMoles: 1 },
                hard: { duration: 30, minTime: 480, maxTime: 900, specialChance: 0.25, maxMoles: 2 }
            };

            window.addEventListener('load', () => {
                setTimeout(() => {
                    splashScreen.style.opacity = '0';
                    setTimeout(() => splashScreen.style.display = 'none', 700);
                }, 1500);
                timeDisplay.textContent = config[currentDiff].duration;
            });

            // Hammer logic for PC
            document.addEventListener('mousemove', (e) => {
                if(window.matchMedia("(pointer: fine)").matches) {
                    hammerCursor.style.left = e.clientX + 'px';
                    hammerCursor.style.top = e.clientY + 'px';
                }
            });
            document.addEventListener('pointerdown', () => hammerCursor.classList.add('strike'));
            document.addEventListener('pointerup', () => hammerCursor.classList.remove('strike'));

            document.getElementById('fullscreenBtn').addEventListener('click', () => {
                try {
                    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
                    else document.exitFullscreen().catch(()=>{});
                } catch(err) {}
            });

            function updateLivesUI() {
                livesHearts.forEach((heart, i) => {
                    if (i < lives) heart.classList.remove('lost');
                    else heart.classList.add('lost');
                });
            }

            function spawnMole() {
                if (!isPlaying || isPaused) return;

                const openHoles = Array.from(holes).filter(h => !h.classList.contains('up') && h.dataset.locked !== 'true');
                if (openHoles.length === 0 || activeMoles >= config[currentDiff].maxMoles) {
                    gameLoopTimer = setTimeout(spawnMole, 200);
                    return;
                }

                const hole = openHoles[Math.floor(Math.random() * openHoles.length)];
                const img = hole.querySelector('.mole');
                const conf = config[currentDiff];

                let type = 'normal';
                let chance = Math.random();
                
                if (currentDiff === 'hard') {
                    if (chance < 0.18) type = 'spoof'; 
                    else if (chance < 0.38) type = 'special'; 
                } else {
                    if (chance < conf.specialChance) type = 'special';
                }

                hole.dataset.type = type;
                hole.dataset.locked = 'false'; 
                hole.classList.remove('whacked'); 

                if (type === 'special') {
                    img.src = SPECIAL_IMG;
                    img.className = 'mole special';
                } else if (type === 'spoof') {
                    img.src = SPOOF_IMG;
                    img.className = 'mole spoof';
                } else {
                    img.src = NORMAL_IMG;
                    img.className = 'mole';
                }

                hole.classList.add('up');
                activeMoles++;

                // Speed increases slightly as timer counts down
                let timeProgressFactor = 0.80 + (0.20 * (timeLeft / conf.duration));
                const stayTime = (Math.random() * (conf.maxTime - conf.minTime) + conf.minTime) * timeProgressFactor;
                
                const hideTimer = setTimeout(() => {
                    if (hole.classList.contains('up') && !hole.classList.contains('whacked')) {
                        hole.classList.remove('up');
                        activeMoles--;
                    }
                }, stayTime);
                
                hole.dataset.timerId = hideTimer;

                const nextTime = (Math.random() * 450 + 350) * timeProgressFactor;
                gameLoopTimer = setTimeout(spawnMole, nextTime);
            }

            function createFloatingText(x, y, text, typeClass) {
                const el = document.createElement('div');
                el.textContent = text;
                el.className = `hit-text ${typeClass}`;
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                wrapper.appendChild(el);
                setTimeout(() => el.remove(), 600);
            }

            function handleHit(e) {
                if (!isPlaying || isPaused) return;
                
                const hole = e.target.closest('.hole');
                if (!hole) return;

                if (hole.dataset.locked === 'true' || hole.classList.contains('whacked')) return;
                
                const rect = hole.getBoundingClientRect();
                const x = e.clientX || (e.touches ? e.touches[0].clientX : rect.left + rect.width/2);
                const y = e.clientY || (e.touches ? e.touches[0].clientY : rect.top + rect.height/2);

                hole.dataset.locked = 'true';
                
                if (hole.classList.contains('up')) {
                    clearTimeout(parseInt(hole.dataset.timerId));
                    hole.classList.add('whacked'); 
                    activeMoles--;
                    
                    setTimeout(() => {
                        hole.classList.remove('up', 'whacked');
                        hole.dataset.locked = 'false';
                    }, 200);
                    
                    const type = hole.dataset.type;
                    if (type === 'spoof') {
                        score -= 5;
                        playSound('spoof');
                        createFloatingText(x, y, `-${getRandomText('miss', dict.funnyMiss)}`, "hit-bad");
                        wrapper.classList.add('shake-hard');
                        setTimeout(() => wrapper.classList.remove('shake-hard'), 400);
                    } else {
                        const earnedPts = (type === 'special') ? 2 : 1;
                        score += earnedPts;
                        
                        playSound(type === 'special' ? 'hitSpecial' : 'hitNormal');
                        createFloatingText(x, y, `+${earnedPts}`, type === 'special' ? "hit-special" : "hit-normal");
                        
                        if(type === 'special') {
                            wrapper.classList.add('shake-screen');
                            setTimeout(() => wrapper.classList.remove('shake-screen'), 300);
                        }
                    }
                } else {
                    // Penalty for missing target (Hitting empty hole)
                    lives--;
                    score--;
                    playSound('miss');
                    createFloatingText(x, y, `-${getRandomText('miss', dict.funnyMiss)}`, "hit-bad");
                    wrapper.classList.add('shake-screen');
                    setTimeout(() => wrapper.classList.remove('shake-screen'), 300);
                    updateLivesUI();

                    setTimeout(() => { hole.dataset.locked = 'false'; }, 200);
                    if (lives <= 0) endGame('dead');
                }
                
                scoreDisplay.textContent = score;
            }

            holes.forEach(hole => { hole.addEventListener('pointerdown', handleHit); });

            function startCountdown() {
                clearInterval(countdownTimer);
                countdownTimer = setInterval(() => {
                    if (!isPaused) {
                        timeLeft--;
                        timeDisplay.textContent = timeLeft;
                        
                        if(timeLeft <= 10 && timeLeft > 0) {
                            timeDisplay.classList.add('animate-pulse');
                            wrapper.classList.add('panic-mode');
                        } else {
                            wrapper.classList.remove('panic-mode');
                        }
                        
                        if (timeLeft <= 0) endGame('timeout');
                    }
                }, 1000);
            }

            function startGame() {
                initAudio();
                isPlaying = true;
                isPaused = false;
                score = 0;
                lives = 5;
                timeLeft = config[currentDiff].duration;
                activeMoles = 0;
                
                scoreDisplay.textContent = score;
                timeDisplay.textContent = timeLeft;
                timeDisplay.classList.remove('animate-pulse');
                wrapper.classList.remove('panic-mode');
                updateLivesUI();
                
                startBtn.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
                endBtn.classList.remove('hidden');
                diffBtns.forEach(b => b.disabled = true);

                holes.forEach(h => {
                    h.classList.remove('up', 'whacked');
                    h.dataset.locked = 'false';
                    clearTimeout(parseInt(h.dataset.timerId));
                });

                startCountdown();
                spawnMole();
            }

            function togglePause() {
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? "Resume" : "Pause";
                pauseBtn.classList.toggle('bg-purple-500', isPaused);
                pauseBtn.classList.toggle('bg-blue-400', !isPaused);
            }

            function endGame(reason) {
                isPlaying = false;
                clearTimeout(gameLoopTimer);
                clearInterval(countdownTimer);
                timeDisplay.classList.remove('animate-pulse');
                wrapper.classList.remove('panic-mode');
                
                playSound('over');

                startBtn.classList.remove('hidden');
                pauseBtn.classList.add('hidden');
                endBtn.classList.add('hidden');
                pauseBtn.textContent = "Pause";
                pauseBtn.classList.remove('bg-purple-500');
                pauseBtn.classList.add('bg-blue-400');
                diffBtns.forEach(b => b.disabled = false);

                holes.forEach(h => {
                    h.classList.remove('up', 'whacked');
                    clearTimeout(parseInt(h.dataset.timerId));
                });

                closeMsgBtn.textContent = getRandomText('playAgain', dict.playAgain);
                finalScoreDisplay.textContent = score;
                
                // High Score Logic
                if (score > storedHighScore) {
                    storedHighScore = score;
                    localStorage.setItem('rishiHighScore', storedHighScore);
                    highScoreDisplay.textContent = storedHighScore;
                    highScoreBadge.classList.remove('hidden');
                } else {
                    highScoreBadge.classList.add('hidden');
                }
                
                if (reason === 'timeout' && score >= 40) {
                    msgTitle.textContent = getRandomText('highScore', dict.highScore);
                    msgTitle.className = "text-3xl font-black text-emerald-600 mb-2 animate-bounce";
                    popupLogo.src = SPECIAL_IMG;
                    msgTop.textContent = "Nee rishi ah";
                    msgBottom.textContent = "thadava adichiruka.";
                } else if (reason === 'timeout') {
                    msgTitle.textContent = getRandomText('timeoutTitle', dict.timeoutTitle);
                    msgTitle.className = "text-3xl font-black text-gray-800 mb-2";
                    popupLogo.src = NORMAL_IMG;
                    msgTop.textContent = getRandomText('normalTop', dict.normalTop);
                    msgBottom.textContent = getRandomText('normalBottom', dict.normalBottom);
                } else if (reason === 'dead') {
                    msgTitle.textContent = getRandomText('deadTitle', dict.deadTitle);
                    msgTitle.className = "text-3xl font-black text-red-600 mb-2 animate-pulse drop-shadow-md";
                    popupLogo.src = NORMAL_IMG; 
                    msgTop.textContent = getRandomText('normalTop', dict.normalTop);
                    msgBottom.textContent = getRandomText('deadBottom', dict.deadBottom);
                } else if (reason === 'quit') {
                    msgTitle.textContent = getRandomText('quitTitle', dict.quitTitle);
                    msgTitle.className = "text-3xl font-black text-purple-600 mb-2";
                    popupLogo.src = NORMAL_IMG;
                    msgTop.textContent = getRandomText('quitTop', dict.quitTextTop);
                    msgBottom.textContent = getRandomText('quitBottom', dict.quitTextBottom);
                }

                setTimeout(() => messageBox.classList.remove('hidden'), 500);
            }

            startBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', togglePause);
            endBtn.addEventListener('click', () => endGame('quit'));

            closeMsgBtn.addEventListener('click', () => {
                messageBox.classList.add('hidden');
                scoreDisplay.textContent = '0';
                timeDisplay.textContent = config[currentDiff].duration;
                lives = 5;
                updateLivesUI();
            });

            diffBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (isPlaying) return;
                    diffBtns.forEach(b => {
                        b.classList.remove('bg-emerald-500', 'text-white', 'shadow-xl', 'border-emerald-700');
                        b.classList.add('bg-white/50', 'text-emerald-900');
                    });
                    const target = e.target;
                    target.classList.add('bg-emerald-500', 'text-white', 'shadow-xl', 'border-emerald-700');
                    target.classList.remove('bg-white/50', 'text-emerald-900');
                    currentDiff = target.dataset.diff;
                    timeDisplay.textContent = config[currentDiff].duration;
                    
                    if(currentDiff === 'hard') wrapper.classList.add('hard-mode');
                    else wrapper.classList.remove('hard-mode');
                });
            });

        })();
    </script>
</body>
</html>
